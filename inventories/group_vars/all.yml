timezone: Europe/Berlin
admin_user: moritzpalm

docker_daemon_options:
  log-driver: json-file
  log-opts:
    max-size: "10m"
    max-file: "3"

# Branch of home_server_compose deployed to /srv/compose. Override per-run with
#   -e compose_branch=feat/public-ingress
# to test a branch; omit the flag to roll back to main.
compose_branch: main

compose_root: /srv/compose
config_path: /srv/data/configs
database_dir: /srv/data/db
cache_dir: /srv/data/cache
media_path: /mnt/storage/media
media_library_dirs:
  - "{{ media_path }}/movies"
  - "{{ media_path }}/tv"
  - "{{ media_path }}/music"
  - "{{ media_path }}/books"
  # Calibre library managed by calibre-web-automated
  - "{{ media_path }}/calibre"
  - "{{ media_path }}/audiobooks"
  - "{{ media_path }}/xxx"
torrent_path: /mnt/storage/downloads/torrents
downloads_path: /mnt/storage/downloads
soulseek_path: /mnt/storage/downloads/soulseek
storage_path: /mnt/storage
backup_path: /mnt/backups
log_dir: /srv/logs

ssd_dirs:
  - "/srv/compose"
  - "/srv/data/configs"
  - "/srv/data/db"
  - "/srv/data/cache"
  - "/srv/logs"

admin_ssh_public_keys:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO4Fe+sdTMI8vP5Ka2gEuzpWfgCf1oTCQ8z1KSLgxR04 moritz.palm@web.de"

tailscale_operator: "moritzpalm"

plex_url: "100.78.131.48:32401"

# Plex 1.43 refuses plaintext HTTP from anything but its own loopback ("Request:
# plaintext connection from <ip> rejected because secure connections are
# required"), so http://plex:32400 no longer works from another container. Its
# certificate is valid only for *.<CertificateUUID>.plex.direct, and plex.direct
# DNS resolves a hyphenated-IP label back to that address — so this is the one
# URL that both reaches Plex and passes certificate verification.
#
# lan_ip, not the container IP: docker assigns the latter dynamically. Resolving
# it needs public DNS, which is why the address is embedded in the label rather
# than looked up.
plex_secure_url: "https://{{ lan_ip | replace('.', '-') }}.{{ plex_certificate_uuid }}.plex.direct:32400"

# --- public ingress -----------------------------------------------------------
lan_subnet: 192.168.178.0/24

public_domain: moritzpalm.com
internal_domain: int.moritzpalm.com
acme_email: moritz.palm@protonmail.com

# Hostnames served through the Cloudflare Tunnel (entrypoint "tunnel", :8443).
# These are unreachable by hitting the public IP directly — see the entrypoint
# split in the ingress design.
tunnel_hosts:
  homepage: "home.{{ public_domain }}"
  overseerr: "requests.{{ public_domain }}"
  vikunja: "tasks.{{ public_domain }}"
  tandoor: "recipes.{{ public_domain }}"
  hevy: "fitness.{{ public_domain }}"
  authentik: "auth.{{ public_domain }}"
  immich: "photos.{{ public_domain }}"
  audiobookshelf: "listen.{{ public_domain }}"
  kavita: "read.{{ public_domain }}"
  shelfarr: "books.{{ public_domain }}"
  cwa: "library.{{ public_domain }}"
  # Serves bookbridge's split kosync port only, never its dashboard.
  bookbridge: "kosync.{{ public_domain }}"

# Hostnames served on the websecure entrypoint only. *.{{ internal_domain }}
# resolves to the tailnet address and :443 is not forwarded at the router, so
# these are reachable from the tailnet and the LAN, never from the internet.
internal_hosts:
  paperless: "docs.{{ internal_domain }}"
  immich: "immich.{{ internal_domain }}"
  cwa: "cwa.{{ internal_domain }}"

# Nothing is served over a directly forwarded port any more: every public
# hostname goes through the outbound-only tunnel. Plex is the sole exception
# and it does not use Traefik at all.

# Ports allowed inbound from the internet. Everything else is dropped by the
# firewall role's DOCKER-USER rules.
#
# These are CONTAINER ports, not host ports: DOCKER-USER hangs off FORWARD and
# sees packets after Docker's DNAT has rewritten the destination. Plex
# publishes 32400:32400, so the two coincide; if the host side is ever
# remapped, this entry must stay the container port or it never matches.
#
# Plex is the ONLY inbound port. Everything else reaches the internet through
# the outbound-only Cloudflare Tunnel, so there is nothing else to forward.
wan_allowed_container_ports:
  - { port: 32400, comment: "Plex direct, no proxy" }

# Hostnames cloudflared accepts and forwards to Traefik's tunnel entrypoint.
# Anything not listed is refused at the tunnel. 
cloudflared_ingress_hosts:
  - "{{ tunnel_hosts.homepage }}"
  - "{{ tunnel_hosts.authentik }}"
  - "{{ tunnel_hosts.overseerr }}"
  - "{{ tunnel_hosts.vikunja }}"
  - "{{ tunnel_hosts.tandoor }}"
  - "{{ tunnel_hosts.hevy }}"
  - "{{ tunnel_hosts.immich }}"
  - "{{ tunnel_hosts.audiobookshelf }}"
  - "{{ tunnel_hosts.kavita }}"
  - "{{ tunnel_hosts.shelfarr }}"
  - "{{ tunnel_hosts.cwa }}"
  - "{{ tunnel_hosts.bookbridge }}"

# Hosts protected by authentik forward-auth. Each gets an outpost callback
# router generated in routers.yml. Only for apps with no login of their own;
# anything with a native mobile client must use OIDC instead.
authentik_forward_auth_hosts:
  - "{{ tunnel_hosts.homepage }}"
  - "{{ tunnel_hosts.hevy }}"

paperless_path: /mnt/storage/documents

backup_textfile_dir: /srv/data/node-exporter-textfile
