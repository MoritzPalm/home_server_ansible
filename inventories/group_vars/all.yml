  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO4Fe+sdTMI8vP5Ka2gEuzpWfgCf1oTCQ8z1KSLgxR04 moritz.palm@web.de"

tailscale_operator: "moritzpalm"

plex_url: "100.78.131.48:32401"

# --- public ingress -----------------------------------------------------------
lan_subnet: 192.168.178.0/24

public_domain: moritzpalm.com
internal_domain: int.moritzpalm.com
acme_email: moritz.palm@protonmail.com

# Hostnames served through the Cloudflare Tunnel (entrypoint "tunnel", :8443).
# These are unreachable by hitting the public IP directly — see the entrypoint
# split in the ingress design.
tunnel_hosts:
  homepage: "home.{{ public_domain }}"
  overseerr: "requests.{{ public_domain }}"
  vikunja: "tasks.{{ public_domain }}"
  tandoor: "recipes.{{ public_domain }}"
  paperless: "docs.{{ public_domain }}"
  hevy: "fitness.{{ public_domain }}"
  authentik: "auth.{{ public_domain }}"

# Hostnames served over the directly forwarded :443 (entrypoint "websecure").
direct_hosts:
  immich: "photos.{{ public_domain }}"

# Ports allowed inbound from the internet. Everything else is dropped by the
# firewall role's DOCKER-USER rules.
#
# These are CONTAINER ports, not host ports: DOCKER-USER hangs off FORWARD and
# sees packets after Docker's DNAT has rewritten the destination. Plex is
# therefore 32400 here even though the host publishes 32401 — writing 32401
# would look correct and silently never match.
#
# Plex is listed from the start because its remote access already works today —
# an empty list would take a working service down. 443 stays commented until
# Traefik exists and the Fritz!Box forward + IPv6 pinhole are configured.
wan_allowed_container_ports:
  - { port: 32400, comment: "Plex direct, no proxy" }
#  - { port: 443, comment: "Traefik websecure (Immich)" }

paperless_path: /mnt/storage/documents
