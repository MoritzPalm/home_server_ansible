timezone: Europe/Berlin
admin_user: moritzpalm

# Branch of home_server_compose deployed to /srv/compose. Override per-run with
#   -e compose_branch=feat/public-ingress
# to test a branch; omit the flag to roll back to main.
compose_branch: main

compose_root: /srv/compose
config_path: /srv/data/configs
database_dir: /srv/data/db
cache_dir: /srv/data/cache
media_path: /mnt/storage/media
media_library_dirs:
  - "{{ media_path }}/movies"
  - "{{ media_path }}/tv"
  - "{{ media_path }}/music"
  - "{{ media_path }}/books"
  - "{{ media_path }}/xxx"
torrent_path: /mnt/storage/downloads/torrents
downloads_path: /mnt/storage/downloads
soulseek_path: /mnt/storage/downloads/soulseek
storage_path: /mnt/storage
backup_path: /mnt/backups
log_dir: /srv/logs

ssd_dirs:
  - "/srv/compose"
  - "/srv/data/configs"
  - "/srv/data/db"
  - "/srv/data/cache"
  - "/srv/logs"

