# storage
hdd_mounts:
  - { uuid: "c7ce78c0-0d5b-4c74-9b02-102b6a18cf71", path: "/mnt/hdd1", fstype: ext4 }
  - { uuid: "36453ee3-a0b3-4002-b0b9-b6212855cf64", path: "/mnt/hdd2", fstype: ext4 }
mergerfs:
  mount: /mnt/storage
  srcs: ["/mnt/hdd1", "/mnt/hdd2"]


tailscale_hostname: "mserver"
# Advertised on join. The tailnet policy's ACL and SSH rules target this tag,
# and it must be listed under tagOwners there or the join is refused.
tailscale_tags: ["tag:server"]
tailscale_authkey: "{{ vault_tailscale_authkey }}"
host_ip: 100.78.131.48
lan_ip: 192.168.178.35

# CertificateUUID from Plex's Preferences.xml. Changes only if the server
# identity is reset; roles/media asserts it still matches the running server.
plex_certificate_uuid: "27e660cb671a4e1187ed1b18655a18e2"

plex_claim: "{{ vault_plex_claim | default('') }}"
cloudflare_dns_api_token: "{{ vault_cloudflare_dns_api_token }}"
crowdsec_bouncer_key: "{{ vault_crowdsec_bouncer_key }}"

# Authentik. Generate each with: openssl rand -base64 60 | tr -d '\n'
# secret_key signs sessions and tokens — rotating it logs everyone out.
authentik_secret_key: "{{ vault_authentik_secret_key }}"
authentik_postgres_password: "{{ vault_authentik_postgres_password }}"
# Bootstrap values are read only on a fresh database, to create the initial
# admin. roles/identity passes them to the container only while the database
# is uninitialised (authentik_bootstrap), so keep them vaulted for rebuilds.
authentik_bootstrap_password: "{{ vault_authentik_bootstrap_password | default('') }}"
authentik_bootstrap_token: "{{ vault_authentik_bootstrap_token | default('') }}"

# Cloudflare Tunnel. Both come from 'cloudflared tunnel create <name>':
# the UUID it prints, and the entire contents of the credentials JSON it writes.
cloudflared_tunnel_id: "{{ vault_cloudflared_tunnel_id }}"
cloudflared_credentials: "{{ vault_cloudflared_credentials }}"

# OIDC client secrets. Shared between authentik (which reads them via the
# blueprint !Env tag) and each app. Generate with: openssl rand -hex 32
oidc_vikunja_secret: "{{ vault_oidc_vikunja_secret }}"
oidc_tandoor_secret: "{{ vault_oidc_tandoor_secret }}"
oidc_immich_secret: "{{ vault_oidc_immich_secret }}"
oidc_paperless_secret: "{{ vault_oidc_paperless_secret }}"
oidc_audiobookshelf_secret: "{{ vault_oidc_audiobookshelf_secret }}"
oidc_kavita_secret: "{{ vault_oidc_kavita_secret }}"
oidc_shelfarr_secret: "{{ vault_oidc_shelfarr_secret }}"
oidc_cwa_secret: "{{ vault_oidc_cwa_secret }}"

paperless_postgres_password: "{{ vault_paperless_postgres_password }}"
# Django SECRET_KEY. Rotating it invalidates sessions and password-reset links.
paperless_secret_key: "{{ vault_paperless_secret_key }}"
# Consumed only on first start, to create the initial superuser.
paperless_admin_password: "{{ vault_paperless_admin_password }}"

# restic repository encryption. Store a copy outside this repo: without it the
# backups cannot be restored, including after losing this machine.
restic_password: "{{ vault_restic_password }}"

