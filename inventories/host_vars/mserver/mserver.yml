# storage
hdd_mounts:
  - { uuid: "c7ce78c0-0d5b-4c74-9b02-102b6a18cf71", path: "/mnt/hdd1", fstype: ext4 }
  - { uuid: "36453ee3-a0b3-4002-b0b9-b6212855cf64", path: "/mnt/hdd2", fstype: ext4 }
mergerfs:
  mount: /mnt/storage
  srcs: ["/mnt/hdd1", "/mnt/hdd2"]


tailscale_hostname: "mserver"
tailscale_authkey: "{{ vault_tailscale_authkey }}"
host_ip: 100.78.131.48
lan_ip: 192.168.178.35

plex_claim: "{{ vault_plex_claim | default('') }}"
cloudflare_dns_api_token: "{{ vault_cloudflare_dns_api_token }}"
crowdsec_bouncer_key: "{{ vault_crowdsec_bouncer_key }}"

# Authentik. Generate each with: openssl rand -base64 60 | tr -d '\n'
# secret_key signs sessions and tokens — rotating it logs everyone out.
authentik_secret_key: "{{ vault_authentik_secret_key }}"
authentik_postgres_password: "{{ vault_authentik_postgres_password }}"
# Bootstrap values are read only on first start, to create the initial admin.
authentik_bootstrap_password: "{{ vault_authentik_bootstrap_password }}"
authentik_bootstrap_token: "{{ vault_authentik_bootstrap_token }}"
