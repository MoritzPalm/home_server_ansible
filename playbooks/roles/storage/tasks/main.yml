- name: Backup /etc/fstab once
  ansible.builtin.copy:
    src: /etc/fstab
    dest: /etc/fstab.ansible.bak
    backup: true
    remote_src: true
    force: false

- name: Install mergerfs
  apt:
    name: mergerfs
    state: present
    update_cache: true

- name: Ensure raw disk mountpoints exist
  file:
    path: "{{ item.path }}"
    state: directory
    mode: "0755"
  loop: "{{ hdd_mounts }}"

- name: Assert all UUIDs are present
  command: "blkid -t UUID={{ item.uuid }}"
  register: blkid
  failed_when: false
  changed_when: false
  loop: "{{ hdd_mounts }}"
  check_mode: no

- name: List block devices when a UUID is missing
  ansible.builtin.command: blkid
  register: blkid_all
  changed_when: false
  when: blkid.results | selectattr('rc', 'ne', 0) | list | length > 0

# A replaced disk has a new UUID, so this fires during exactly the recovery it
# needs to help with. Printing the actual UUIDs turns it from a puzzle into a
# copy-paste.
- name: Fail with the UUIDs actually present
  ansible.builtin.fail:
    msg: |-
      Disk UUID(s) in hdd_mounts not found:
      {% for r in blkid.results | selectattr('rc', 'ne', 0) %}
        missing: {{ r.item.uuid }}  (expected at {{ r.item.path }})
      {% endfor %}

      Present on this machine:
      {{ blkid_all.stdout }}

      If a disk was replaced, update hdd_mounts in
      inventories/host_vars/mserver/mserver.yml and re-run.
      See docs/runbooks/04-disk-failure.md.
  when: blkid.results | selectattr('rc', 'ne', 0) | list | length > 0

- name: Mount HDDs by UUID and persist in fstab
  mount:
    path: "{{ item.path }}"
    src: "UUID={{ item.uuid }}"
    fstype: "{{ item.fstype | default('ext4') }}"
    opts: "defaults,nofail,x-systemd.device-timeout=10s"
    state: mounted
  loop: "{{ hdd_mounts }}"

- name: Ensure mergerfs mountpoint exists
  file:
    path: "{{ mergerfs.mount }}"
    state: directory
    mode: "0755"

- name: Mount mergerfs pool and persist
  mount:
    path: "{{ mergerfs.mount }}"
    src: "{{ mergerfs.srcs | join(':') }}"
    fstype: "fuse.mergerfs"
    # include use_ino and reasonable defaults for media workflows
    opts: "{{ mergerfs.opts | default('defaults,allow_other,use_ino,category.create=epmfs,minfreespace=50G,moveonenospc=true,dropcacheonclose=true,fsname=mergerfs') }}"
    state: mounted

- name: Verify pool is mounted
  command: mountpoint -q {{ mergerfs.mount }}
  changed_when: false


- name: Ensure backup directory exists on pool
  file:
    path: "{{ storage_path }}/backups"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0700"

- name: Ensure backup bind mount point exists
  file:
    path: /mnt/backups
    state: directory
    mode: "0755"

- name: Bind mount backup directory and persist in fstab
  mount:
    path: /mnt/backups
    src: "{{ storage_path }}/backups"
    fstype: none
    opts: bind,nofail
    state: mounted

- name: Create download directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ admin_user }}"
    group: docker
    mode: "0775"
  loop:
    - "{{ downloads_path }}"
    - "{{ torrent_path }}"
    - "{{ torrent_path }}/incomplete"
    - "{{ torrent_path }}/movies"
    - "{{ torrent_path }}/tv"
    - "{{ torrent_path }}/music"
    - "{{ torrent_path }}/books"
    - "{{ torrent_path }}/xxx"

- name: Create soulseek download directories
  file:
    path: "{{ item }}"
    state: directory
    owner: 1000
    group: 1000
    mode: "0775"
  loop:
    - "{{ soulseek_path }}"
    - "{{ soulseek_path }}/incomplete"
    - "{{ soulseek_path }}/complete"


- name: Create media root directory
  file:
    path: "{{ media_path }}"
    state: directory
    owner: "{{ admin_user }}"
    group: docker
    mode: "0775"

- name: Create media library directories
  file:
    path: "{{ item }}"
    state: directory
    owner: 1000
    group: 1000
    mode: "0775"
  loop: "{{ media_library_dirs }}"

- name: Enforce 1000:1000 ownership inside media libraries
  command: >-
    find {{ media_library_dirs | join(' ') }}
    ( ! -user 1000 -o ! -group 1000 )
    -print -exec chown 1000:1000 {} +
  register: media_library_chown
  changed_when: media_library_chown.stdout | length > 0

- name: Ensure media library directories are owner/group writable
  command: >-
    find {{ media_library_dirs | join(' ') }}
    -type d ! -perm -0770
    -print -exec chmod ug+rwx {} +
  register: media_library_chmod
  changed_when: media_library_chmod.stdout | length > 0