- name: add compose root to git safe directories
  ansible.builtin.command:
    cmd: git config --global --add safe.directory '{{ item }}'
  become: true
  changed_when: false
  loop:
    - "{{ compose_root }}"
    - "{{ config_path }}"
  tags:
    - docker

- name: Check for an existing compose clone
  ansible.builtin.stat:
    path: "{{ compose_root }}/.git"
  register: compose_git
  tags:
    - docker

- name: Widen compose clone refspec to all branches
  ansible.builtin.command:
    cmd: git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
    chdir: "{{ compose_root }}"
  when: compose_git.stat.exists
  changed_when: false
  tags:
    - docker

# version is parameterised so a feature branch can be deployed for testing with
#   -e compose_branch=feat/public-ingress
# and rolled back by simply dropping the flag (default is main). 'force: true'
# means the flip back is a hard reset, not a merge — no drift to reconcile.
- name: clone repository containing compose files
  ansible.builtin.git:
    repo: 'https://github.com/MoritzPalm/home_server_compose.git'
    dest: '{{ compose_root }}'
    accept_newhostkey: true
    version: "{{ compose_branch }}"
    force: true
  tags:
    - docker

- name: warn when deploying a non-default compose branch
  ansible.builtin.debug:
    msg: >-
      Deploying compose branch '{{ compose_branch }}' — this is NOT main.
      Drop '-e compose_branch=...' to return to main.
  when: compose_branch != 'main'
  tags:
    - docker

# Portainer is retired: it held the raw Docker socket behind a web login, and
# Ansible already owns every stack. These remove what it left on the host.
- name: Remove the Portainer container
  community.docker.docker_container:
    name: portainer
    state: absent
  tags:
    - docker

- name: Remove Portainer's volume
  community.docker.docker_volume:
    name: portainer_data
    state: absent
  tags:
    - docker

- name: Remove Portainer's network
  community.docker.docker_network:
    name: portainer_network
    state: absent
  tags:
    - docker

# Holds the untracked admin_password.txt and .env the clone leaves behind.
- name: Remove Portainer's compose directory
  ansible.builtin.file:
    path: "{{ compose_root }}/portainer"
    state: absent
  tags:
    - docker

- name: Create shared Docker networks
  community.docker.docker_network:
    name: "{{ item }}"
    state: present
  loop:
    - media_network
    - arr
  tags:
    - docker
    - networking
