- name: add compose root to git safe directories
  ansible.builtin.command:
    cmd: git config --global --add safe.directory '{{ item }}'
  become: true
  changed_when: false
  loop:
    - "{{ compose_root }}"
    - "{{ config_path }}"
  tags:
    - docker

# version is parameterised so a feature branch can be deployed for testing with
#   -e compose_branch=feat/public-ingress
# and rolled back by simply dropping the flag (default is main). 'force: true'
# means the flip back is a hard reset, not a merge — no drift to reconcile.
- name: clone repository containing compose files
  ansible.builtin.git:
    repo: 'https://github.com/MoritzPalm/home_server_compose.git'
    dest: '{{ compose_root }}'
    accept_newhostkey: true
    single_branch: yes
    version: "{{ compose_branch }}"
    force: true
  tags:
    - docker

- name: warn when deploying a non-default compose branch
  ansible.builtin.debug:
    msg: >-
      Deploying compose branch '{{ compose_branch }}' — this is NOT main.
      Drop '-e compose_branch=...' to return to main.
  when: compose_branch != 'main'
  tags:
    - docker

- name: create admin password file for portainer
  copy:
    dest: "{{ compose_root }}/portainer/admin_password.txt"
    owner: root
    group: docker
    mode: "0640"
    content: "{{ portainer_admin_password }}"

- name: create env file for portainer
  copy:
    dest: "{{ compose_root }}/portainer/.env"
    owner: root
    group: docker
    mode: "0640"
    content: |
      HOST_IP={{ host_ip }}
      ADMIN_PASSWORD_FILE={{ compose_root }}/portainer/admin_password.txt
      PORTAINER_LICENSE_KEY={{ portainer_license_key }}

- name: Create shared Docker networks
  community.docker.docker_network:
    name: "{{ item }}"
    state: present
  loop:
    - media_network
    - arr
  tags:
    - docker
    - networking

- name: run portainer docker compose file
  community.docker.docker_compose_v2:
    project_src: "{{ compose_root }}/portainer"
    files: "portainer.yml"



