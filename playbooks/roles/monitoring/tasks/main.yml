# --- Prometheus ---

- name: Ensure prometheus config directories exist
  file:
    path: "{{ item }}"
    state: directory
    owner: "65534"
    group: "65534"
    mode: "0755"
  loop:
    - "{{ config_path }}/prometheus"
    - "{{ config_path }}/prometheus/rules"
  tags:
    - monitoring

- name: Ensure prometheus database directory exists
  file:
    path: "{{ database_dir }}/prometheus"
    state: directory
    owner: "65534"
    group: "65534"
    mode: "0755"
  tags:
    - monitoring

- name: Render prometheus config
  template:
    src: prometheus.yml.j2
    dest: "{{ config_path }}/prometheus/prometheus.yml"
    owner: "65534"
    group: "65534"
    mode: "0644"
  notify: Restart prometheus
  tags:
    - monitoring

- name: Render prometheus alert rules
  template:
    src: prometheus-alerts.yml.j2
    dest: "{{ config_path }}/prometheus/rules/alerts.yml"
    owner: "65534"
    group: "65534"
    mode: "0644"
  notify: Restart prometheus
  tags:
    - monitoring

