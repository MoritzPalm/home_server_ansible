    - monitoring

# --- .env ---

- name: Create .env file for monitoring stack
  copy:
    dest: "{{ compose_root }}/monitoring/.env"
    owner: root
    group: docker
    mode: "0640"
    content: |
      HOST_IP={{ host_ip }}
      CONFIG_PATH={{ config_path }}
      DATABASE_DIR={{ database_dir }}
      # promtail mounts LOG_DIR/traefik to read the access log
      LOG_DIR={{ log_dir }}
      # node-exporter reads the backup job's textfile metrics from here
      TEXTFILE_DIR={{ backup_textfile_dir }}
      GRAFANA_ADMIN_USER={{ grafana_admin_user }}
      GRAFANA_ADMIN_PASSWORD={{ grafana_admin_password }}
      WATCHTOWER_DISCORD_TOKEN={{ watchtower_discord_token }}
      WATCHTOWER_DISCORD_WEBHOOKID={{ watchtower_discord_id }}
  no_log: true
  tags:
    - monitoring

# --- Compose ---

- name: Run monitoring compose file
  community.docker.docker_compose_v2:
    project_src: "{{ compose_root }}/monitoring"
    files: monitoring.yml
    remove_orphans: true  # clean up containers removed from the compose file (e.g. watchtower)
  tags:
    - monitoring


- name: Wait for Grafana to be up
  uri:
    url: "http://{{ ansible_host }}:3000/api/health"
    method: GET
    status_code: 200
  register: grafana_health
  retries: 30
  delay: 5
  until: grafana_health.status == 200
  tags:
    - monitoring

# --- Container health metrics ---

# Created here as well as in the backup role: node-exporter bind-mounts this
# path, and the backup role runs later in site.yml.
- name: Create node-exporter textfile directory
  ansible.builtin.file:
    path: "{{ backup_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - monitoring

- name: Install container health metrics script
  ansible.builtin.template:
    src: container-health.sh.j2
    dest: /usr/local/bin/container-health-metrics
    owner: root
    group: root
    mode: "0755"
  tags:
    - monitoring

- name: Install container health metrics units
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    owner: root
    group: root
    mode: "0644"
    content: "{{ item.content }}"
  loop:
    - name: container-health-metrics.service
      content: |
        # Managed by Ansible (roles/monitoring) — edits are overwritten.
        [Unit]
        Description=Publish Docker healthcheck verdicts as node-exporter metrics
        After=docker.service
        Requires=docker.service

        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/container-health-metrics
    - name: container-health-metrics.timer
      content: |
        # Managed by Ansible (roles/monitoring) — edits are overwritten.
        [Unit]
        Description=Refresh Docker container health metrics

        [Timer]
        OnBootSec=1min
        OnUnitActiveSec=1min

        [Install]
        WantedBy=timers.target
  loop_control:
    label: "{{ item.name }}"
  tags:
    - monitoring

- name: Enable container health metrics timer
  ansible.builtin.systemd:
    name: container-health-metrics.timer
    enabled: true
    state: started
    daemon_reload: true
  tags:
    - monitoring

- name: Publish container health metrics now
  ansible.builtin.command: /usr/local/bin/container-health-metrics
  changed_when: true
  tags:
    - monitoring
