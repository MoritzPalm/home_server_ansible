    state: directory
    owner: "472"
    group: "472"
    mode: "0755"
  loop:
    - "{{ config_path }}/grafana"
    - "{{ config_path }}/grafana/provisioning"
    - "{{ config_path }}/grafana/provisioning/datasources"
    - "{{ config_path }}/grafana/provisioning/dashboards"
