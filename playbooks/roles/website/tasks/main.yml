# Static personal site at the apex. nginx serves the page from the compose
# clone; only the CV lives outside git so it never lands in the public repo.
# nginx runs as uid 101, so the directory and anything dropped into it must be
# world-readable (0755 / 0644).
- name: Create website files directory
  file:
    path: "{{ config_path }}/website/files"
    state: directory
    owner: "{{ admin_user }}"
    group: docker
    mode: "0755"
  tags:
    - website

- name: Create .env file for website stack
  copy:
    dest: "{{ compose_root }}/website/.env"
    owner: root
    group: docker
    mode: "0640"
    content: |
      CONFIG_PATH={{ config_path }}
  tags:
    - website

- name: Run website compose file
  community.docker.docker_compose_v2:
    project_src: "{{ compose_root }}/website"
    files: website.yml
  tags:
    - website
