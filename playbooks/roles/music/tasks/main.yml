- name: Create config dirs for apps
  file:
    path: "{{ config_path }}/soulsync"
    state: directory
    owner: "{{ admin_user }}"
    group: docker
    mode: "0775"
  tags:
    - music
    - soulsync

- name: create soulsync config from template FIRST
  ansible.builtin.template:
    src: soulsync_config.json.j2
    dest: "{{ config_path }}/soulsync/config.json"
    owner: "{{ admin_user }}"
    group: docker
    mode: "0640"
  register: soulsync_config_changed
  tags:
    - music
    - soulsync

- name: Create database dir for soulsync
  file:
    path: "{{ database_dir }}/soulsync"
    state: directory
    owner: "{{ admin_user }}"
    group: docker
    mode: "0775"
  tags:
    - music
    - soulsync

# CRITICAL: Remove database when config changes to force re-migration
- name: Remove existing soulsync database to force config reload
  ansible.builtin.file:
    path: "{{ database_dir }}/soulsync/music_library.db"
    state: absent
  when: soulsync_config_changed.changed
  tags:
    - music
    - soulsync

- name: Create .env file for music stack
  copy:
    dest: "{{ compose_root }}/music/.env"
    owner: root
    group: docker
    mode: "0640"
    content: |
      MEDIA_PATH={{ media_path }}
      CONFIG_PATH={{ config_path }}
      TORRENT_PATH={{ torrent_path }}
      LOG_DIR={{ log_dir }}
      STORAGE_DIR={{ storage_dir }}
      DATABASE_DIR={{ database_dir }}
  tags:
    - music

- name: run music compose file
  community.docker.docker_compose_v2:
    project_src: "{{ compose_root }}/music"
    files: music.yml
  tags:
    - music


