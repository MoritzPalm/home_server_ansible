---
audiobookshelf_library_name: Audiobooks
kavita_library_name: Books

# Audiobookshelf's own scheduled backups: a zip of its database and item
# metadata under /metadata/backups, which is the absdata bind mount restic
# snapshots. Off by default in the image; without it restic copies a live SQLite
# file with no consistent copy to fall back on, unlike the arr apps and kavita,
# which all keep nightly zips. Cron in the container's timezone; 01:30 is before
# the 02:30 restic run, so each snapshot carries that night's zip. The size cap
# is in GB and is enforced by refusing the backup, so keep it above the real
# size (a few MB today).
audiobookshelf_backup_schedule: "30 1 * * *"
audiobookshelf_backups_to_keep: 2
audiobookshelf_max_backup_size_gb: 1

# Where the audiobookshelf API key for bookbridge is kept. Audiobookshelf returns
# a key's value only at creation, so it is written here rather than re-fetched.
# Under config_path, so restic backs it up alongside everything else it belongs
# with — and out of the vault, which is world-readable in a public repo.
audiobookshelf_api_key_file: "{{ config_path }}/bookbridge/.abs_api_key"

# --- calibre-web-automated ----------------------------------------------------
cwa_config_dir: "{{ config_path }}/calibre-web-automated"
# Under downloads_path so Shelfarr, which mounts storage_path, can hardlink into
# it from the torrent folder.
cwa_ingest_dir: "{{ downloads_path }}/cwa-ingest"
cwa_url: "http://{{ ansible_host }}:8083"

# Created by CWA on first start with the password admin123; cwa.yml replaces it.
cwa_admin_username: admin
# Overridden from the vault when set.
cwa_hardcover_token: ""

# Role bits from cps/constants.py: download 2, change password 16, edit shelves
# 64, read in browser 256. No upload, metadata edit or delete for regular users.
# Password change is what lets an OIDC user set a password for OPDS readers.
cwa_default_role: 338

# Auto-fetch takes the first hit from the first provider that returns any, so
# order matters. ibdb and google never return series.
cwa_metadata_providers: >-
  {{ (cwa_hardcover_token | length > 0) | ternary(['hardcover'], [])
     + ['ibdb', 'google', 'dnb'] }}

# The 'settings' table in /config/app.db. CWA reads it once at startup, so
# cwa.yml restarts the container when any value here changes.
cwa_app_settings:
  config_login_type: 2  # LOGIN_OAUTH
  # Empty: the callback follows the request host, so OIDC works on both the
  # public and the cwa.<internal_domain> hostnames (both registered in
  # authentik). A pinned host also becomes Flask's FORCE_HOST_FOR_REDIRECTS,
  # which bounced every redirect on the internal hostname to the public one.
  # OIDC login on the bare tailnet port fails; use the local password there.
  config_oauth_redirect_host: ""
  config_enable_oauth_group_admin_management: 1
  # Disabling the password form also rejects every password login server-side,
  # which leaves no way in while authentik is down and breaks OPDS passwords.
  config_disable_standard_login: 0
  config_public_reg: 0
  config_anonbrowse: 0
  config_remote_login: 0
  config_default_role: "{{ cwa_default_role }}"
  # Nightly metadata.opf beside each book; calibre can rebuild metadata.db from them.
  schedule_metadata_backup: 1

# The generic row of the 'oauthProvider' table in /config/app.db.
cwa_oauth_provider:
  oauth_client_id: cwa
  oauth_client_secret: "{{ oidc_cwa_secret }}"
  oauth_base_url: "https://{{ tunnel_hosts.authentik }}/application/o/cwa-oidc/"
  oauth_authorize_url: "https://{{ tunnel_hosts.authentik }}/application/o/authorize/"
  oauth_token_url: "https://{{ tunnel_hosts.authentik }}/application/o/token/"
  oauth_userinfo_url: "https://{{ tunnel_hosts.authentik }}/application/o/userinfo/"
  # Left empty: when set, CWA refetches discovery at every start and overwrites
  # the endpoints above, which makes startup depend on reaching authentik.
  metadata_url: ""
  scope: openid profile email
  username_mapper: preferred_username
  email_mapper: email
  # Compared case-insensitively against the groups claim on every login; members
  # gain admin, non-members lose it.
  oauth_admin_group: authentik Admins
  login_button: Sign in with authentik
  active: 1

# The 'cwa_settings' table in /config/cwa.db, read fresh by each ingest.
cwa_settings:
  cwa_update_notifications: 0  # Renovate owns updates
  contribute_translations_notifications: 0
  koreader_sync_enabled: 0  # bookbridge serves kosync
  # Both keep a copy of every imported epub under /config, which lands on the
  # SSD and in every restic snapshot. Shelfarr's original stays in the torrent
  # folder for as long as it seeds.
  auto_backup_imports: 0
  auto_backup_epub_fixes: 0
  auto_metadata_fetch_enabled: 1
  auto_metadata_smart_application: 1
  auto_metadata_update_title: 1
  auto_metadata_update_authors: 1
  metadata_provider_hierarchy: "{{ cwa_metadata_providers }}"
