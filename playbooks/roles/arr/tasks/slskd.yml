- name: Create config directory for slskd
  file:
    path: "{{ config_path }}/slskd"
    state: directory
    owner: 1000
    group: 1000
    mode: "0750"

- name: Ensure soulseek download directories exist with correct permissions
  file:
    path: "{{ item }}"
    state: directory
    owner: 1000
    group: 1000
    mode: "0775"
  loop:
    - "{{ soulseek_path }}"
    - "{{ soulseek_path }}/complete"
    - "{{ soulseek_path }}/incomplete"
