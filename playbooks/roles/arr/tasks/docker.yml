- name: create env file for arr stack
  copy:
    dest: "{{ compose_root }}/arr/.env"
    owner: root
    group: docker
    mode: "0640"
    content: |
      CONFIG_PATH={{ config_path }}
      MEDIA_PATH={{ media_path }}
      STORAGE_DIR={{ storage_dir }}
      OPENVPN_USERNAME={{ openvpn_username }}
      OPENVPN_PASSWORD={{ openvpn_password }}
      TORRENT_PATH={{ torrent_path }}
      MAM_SESSION_ID={{ mam_id }}
      ABR_USERNAME={{ abr_username }}
      ABR_PASSWORD={{ abr_password }}
      SOULSEEK_PATH={{ soulseek_path }}

- name: create yml config file for soulseek
  copy:
    dest: "{{ config_path }}/slskd/slskd.yml"
    owner: 1000 
    group: 1000
    mode: "0640"
    content: |
      remote_configuration: true
      headless: false # change this as soon as soularr works
      permissions:
        file:
          mode: 644
      directories:
        downloads: /downloads/complete
        incomplete: /downloads/incomplete
      remote_file_management: true
      shares:
        directories:
          - "/music"
      soulseek:
        username: {{ soulseek_username }}
        password: {{ soulseek_password }}
      web:
        authentication:
          disabled: false
          username: slskd
          password: slskd
          api_keys:
            soularr_api_key:
              key: {{ slskd_api_key }}
              #cidr: 129.168.178.0/24
      


- name: create config file for soularr
  copy:
    dest: "{{ config_path }}/soularr/config.ini"
    owner: root
    group: docker
    mode: "0640"
    content: |
      [Lidarr]
      api_key = {{ lidarr_api_key }}
      host_url = http://lidarr:8686
      download_dir = /downloads/complete 
      disable_sync = False
      [Slskd]
      api_key = {{ slskd_api_key }}
      host_url = http://gluetun:5030
      url_base = /
      download_dir = /downloads
      delete_searches = False
      stalled_timeout = 3600
      [Release Settings]
      use_most_common_tracknum = True
      allow_multi_disc = True
      accepted_countries = Europe,Japan,United Kingdom,United States,[Worldwide],Australia,Canada
      accepted_format = CD,Digital Media,Vinyl
      [Search Settings]
      search_timeout = 5000
      maximum_peer_queue = 50
      minimum_peer_upload_speed = 0
      minimum_filename_match_ration = 0.8
      # preferred filetypes (most to least preferred)
      allowed_filetypes = flac24/192,flac 16/44,flac,mp3 320,mp3
      ignored_users=
      search_for_tracks = True
      album_prepend_artist = True
      track_prepent_artist = True
      search_type = incrementing_page
      number_of_albums_to_grab = 10
      remove_wanted_on_failure = False
      search_source = missing
      [Logging]
      level = INFO
      format = [%(levelname)s|%(module)s|L%(lineno)d] %(asctime)s: %(message)s
      datefmt = %Y-%m-%dT%H:%M:%S%z



- name: run arr compose file
  community.docker.docker_compose_v2:
    project_src: "{{ compose_root }}/arr"
    files: "arr.yml"
