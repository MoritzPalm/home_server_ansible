- name: create env file for arr stack
  copy:
    dest: "{{ compose_root }}/arr/.env"
    owner: root
    group: docker
    mode: "0640"
    content: |
      HOST_IP={{ host_ip }}
      HOST_OVERSEERR={{ tunnel_hosts.overseerr }}
      CONFIG_PATH={{ config_path }}
      MEDIA_PATH={{ media_path }}
      STORAGE_PATH={{ storage_path }}
      OPENVPN_USERNAME={{ openvpn_username }}
      OPENVPN_PASSWORD={{ openvpn_password }}
      TORRENT_PATH={{ torrent_path }}
      MAM_SESSION_ID={{ mam_id }}
      ABR_USERNAME={{ abr_username }}
      ABR_PASSWORD={{ abr_password }}
      SOULSEEK_PATH={{ soulseek_path }}
      SLSKD_UMASK=0022

- name: create yml config file for soulseek
  copy:
    dest: "{{ config_path }}/slskd/slskd.yml"
    owner: 1000 
    group: 1000
    mode: "0640"
    content: |
      remote_configuration: false
      headless: false # change this as soon as soularr works
      directories:
        downloads: /downloads/complete
        incomplete: /downloads/incomplete
      remote_file_management: true
      shares:
        directories:
          - "/music"
      soulseek:
        username: {{ soulseek_username }}
        password: {{ soulseek_password }}
      web:
        authentication:
          disabled: false
          username: slskd
          password: {{ slskd_web_password | default(soulseek_password) }}
          api_keys:
            soularr_api_key:
              key: {{ slskd_api_key }}
              #cidr: 129.168.178.0/24
      

- name: run arr compose file
  community.docker.docker_compose_v2:
    project_src: "{{ compose_root }}/arr"
    files: "arr.yml"

# Containers using network_mode: container:gluetun share its network namespace.
# When gluetun restarts, that namespace is torn down and rebuilt, and docker
# never reattaches the dependents — they keep running with dead networking and
# still report healthy, because their healthchecks probe localhost inside the
# namespace that no longer routes anywhere.
- name: Install gluetun netns guard
  ansible.builtin.template:
    src: gluetun-netns-guard.sh.j2
    dest: /usr/local/bin/gluetun-netns-guard
    owner: root
    group: root
    mode: "0755"
  tags: [arr, arr-gluetun]

- name: Install gluetun netns guard unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/gluetun-netns-guard.service
    mode: "0644"
    content: |
      # Managed by Ansible (roles/arr) — edits are overwritten.
      [Unit]
      Description=Restart containers stranded by a gluetun restart
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/gluetun-netns-guard
  tags: [arr, arr-gluetun]

- name: Install gluetun netns guard timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/gluetun-netns-guard.timer
    mode: "0644"
    content: |
      # Managed by Ansible (roles/arr) — edits are overwritten.
      [Unit]
      Description=Check for containers stranded by a gluetun restart

      [Timer]
      OnBootSec=2min
      OnUnitActiveSec=2min

      [Install]
      WantedBy=timers.target
  tags: [arr, arr-gluetun]

- name: Enable gluetun netns guard timer
  ansible.builtin.systemd:
    name: gluetun-netns-guard.timer
    enabled: true
    state: started
    daemon_reload: true
  tags: [arr, arr-gluetun]

- name: Run the guard now
  ansible.builtin.command: /usr/local/bin/gluetun-netns-guard
  register: arr_netns_guard
  changed_when: arr_netns_guard.stdout | length > 0
  tags: [arr, arr-gluetun]
