    status_code: [200, 201, 202]
    return_content: true
  register: prowlarr_whisparr_update


- name: Get existing download clients (if any)
  uri:
    url: "http://{{ ansible_host }}:9696/api/v1/downloadclient"
    method: GET
    headers:
      X-Api-Key: "{{ prowlarr_api_key }}"
    return_content: true
  register: prowlarr_downloadclients


- name: Extract downloadclient IDs
  set_fact:
    prowlarr_downloadclient_id_list: >-
      {{ prowlarr_downloadclients.json
         | map(attribute='id')
         | list }}


- name: Build qbittorrent application body
  set_fact:
    prowlarr_qbittorrent_body:
      name: "qBittorrent"
      implementation: "QBittorrent"
      configContract: "QBittorrentSettings"
      enable: true
      protocol: "torrent"
      fields:
        - name: "host"
          value: "gluetun"
        - name: "port"
          value: 8088
        - name: "useSsl"
          value: false
        - name: "urlBase"
          value: ""
        - name: "category"
          value: "prowlarr"
        - name: "priority"
          value: 0
        - name: "initialState"
          value: 0
        - name: "sequentialOrder"
          value: false
        - name: "firstAndLast"
          value: false
        - name: "contentLayout"
          value: 0
      priority: 1
      supportsCategories: true
      categories: []
      tags: []


- name: Create qbittorrent app in prowlarr if missing
  when: >
    (prowlarr_downloadclients.json
     | selectattr('implementation', 'equalto', 'QBittorrent')
     | list
     | length) == 0
  uri:
    url: "http://{{ ansible_host }}:9696/api/v1/downloadclient"
    method: POST
    headers:
      X-Api-Key: "{{ prowlarr_api_key }}"
    body_format: json
    body: "{{ prowlarr_qbittorrent_body }}"
    status_code: [200, 201]
    return_content: true
  register: prowlarr_qbittorrent_create


