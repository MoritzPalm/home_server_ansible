      X-Api-Key: "{{ prowlarr_api_key }}"
    body_format: json
    body: "{{ prowlarr_radarr_body }}"
    status_code: [200, 201]
    return_content: true
  register: prowlarr_radarr_create

- name: Create Whisparr app in Prowlarr if it does not exist
  when: prowlarr_whisparr_id == ''
  uri:
    url: "http://{{ ansible_host }}:9696/api/v1/applications"
    method: POST
    headers:
      X-Api-Key: "{{ prowlarr_api_key }}"
    body_format: json
    body: "{{ prowlarr_whisparr_body }}"
    status_code: [200, 201]
    return_content: true
  register: prowlarr_whisparr_create

- name: Build Sonarr body with ID for update
  when: prowlarr_sonarr_id != ''
  set_fact:
    prowlarr_sonarr_body_update: "{{ prowlarr_sonarr_body | combine({'id': prowlarr_sonarr_id}) }}"

- name: Build Radarr body with ID for update
  when: prowlarr_radarr_id != ''
  set_fact:
    prowlarr_radarr_body_update: "{{ prowlarr_radarr_body | combine({'id': prowlarr_radarr_id}) }}"

- name: Build Whisparr body with ID for update
  when: prowlarr_whisparr_id != ''
  set_fact:
    prowlarr_whisparr_body_update: "{{ prowlarr_whisparr_body | combine({'id': prowlarr_whisparr_id}) }}"

- name: Update existing Sonarr app in Prowlarr
  when: prowlarr_sonarr_id != ''
  uri:
    url: "http://{{ ansible_host }}:9696/api/v1/applications/{{ prowlarr_sonarr_id }}"
    method: PUT
    headers:
      X-Api-Key: "{{ prowlarr_api_key }}"
    body_format: json
    body: "{{ prowlarr_sonarr_body_update }}"
    status_code: [200, 201, 202]
    return_content: true
  register: prowlarr_sonarr_update

- name: Update existing Radarr app in Prowlarr
  when: prowlarr_radarr_id != ''
  uri:
    url: "http://{{ ansible_host }}:9696/api/v1/applications/{{ prowlarr_radarr_id }}"
    method: PUT
    headers:
      X-Api-Key: "{{ prowlarr_api_key }}"
    body_format: json
    body: "{{ prowlarr_radarr_body_update }}"
    status_code: [200, 201, 202]
    return_content: true
  register: prowlarr_radarr_update

- name: Update existing Whisparr app in Prowlarr
  when: prowlarr_whisparr_id != ''
  uri:
    url: "http://{{ ansible_host }}:9696/api/v1/applications/{{ prowlarr_whisparr_id }}"
    method: PUT
