- name: Create config directory for prowlarr
  file:
    path: "{{ config_path }}/prowlarr"
    state: directory
    owner: 1000
    group: 1000
    mode: "0750"

- name: Wait for *arr config.xml files to be written
  ansible.builtin.wait_for:
    path: "{{ item }}"
    state: present
    timeout: 120
  loop:
    - "{{ config_path }}/radarr/config.xml"
    - "{{ config_path }}/sonarr/config.xml"
    - "{{ config_path }}/prowlarr/config.xml"
    - "{{ config_path }}/whisparr/config.xml"

- name: Read Radarr config
  slurp:
    src: "{{ config_path }}/radarr/config.xml"
  register: radarr_config

- name: Read Sonarr config
  slurp:
    src: "{{ config_path }}/sonarr/config.xml"
  register: sonarr_config

- name: Read Prowlarr config
  slurp:
    src: "{{ config_path }}/prowlarr/config.xml"
  register: prowlarr_config

- name: Read Whisparr config
  slurp:
    src: "{{ config_path }}/whisparr/config.xml"
  register: whisparr_config


- name: Extract Radarr API Key from config.xml
  set_fact:
    radarr_api_key: >-
      {{
        (radarr_config.content | b64decode)
        | regex_search('<ApiKey>[^<]+</ApiKey>')
        | regex_replace('^<ApiKey>([^<]+)</ApiKey>$', '\1')
      }}

- name: Extract Sonarr API Key from config.xml
  set_fact:
    sonarr_api_key: >-
      {{
        (sonarr_config.content | b64decode)
        | regex_search('<ApiKey>[^<]+</ApiKey>')
        | regex_replace('^<ApiKey>([^<]+)</ApiKey>$', '\1')
      }}

- name: Extract Prowlarr API Key from config.xml
  set_fact:
    prowlarr_api_key: >-
      {{
        (prowlarr_config.content | b64decode)
        | regex_search('<ApiKey>[^<]+</ApiKey>')
        | regex_replace('^<ApiKey>([^<]+)</ApiKey>$', '\1')
      }}

- name: Extract Whisparr API Key from config.xml
  set_fact:
    whisparr_api_key: >-
      {{
        (whisparr_config.content | b64decode)
        | regex_search('<ApiKey>[^<]+</ApiKey>')
        | regex_replace('^<ApiKey>([^<]+)</ApiKey>$', '\1')
      }}

- name: Ensure API keys were found
  assert:
    that:
      - radarr_api_key is defined
      - radarr_api_key | length > 0
      - sonarr_api_key is defined
      - sonarr_api_key | length > 0
      - prowlarr_api_key is defined
      - prowlarr_api_key | length > 0
      - whisparr_api_key is defined
      - whisparr_api_key | length > 0
    fail_msg: "Could not extract API key from config.xml"

- name: Wait for Prowlarr to be up
  uri:
    url: "http://{{ ansible_host }}:9696/ping"
    method: GET
    status_code: 200
  register: prowlarr_ping
  retries: 30
  delay: 2
  until: prowlarr_ping.status == 200

- name: Get existing Prowlarr applications
  uri:
    url: "http://{{ ansible_host }}:9696/api/v1/applications"
    method: GET
    headers:
      X-Api-Key: "{{ prowlarr_api_key }}"
    return_content: true
  register: prowlarr_apps

- name: Extract Sonarr / Radarr app IDs
  set_fact:
    prowlarr_sonarr_id: >-
      {{
        (prowlarr_apps.json
         | selectattr('implementation', 'equalto', 'Sonarr')
         | map(attribute='id')
         | list
         | first)
        | default('', true)
      }}
    prowlarr_radarr_id: >-
      {{
        (prowlarr_apps.json
         | selectattr('implementation', 'equalto', 'Radarr')
         | map(attribute='id')
         | list
         | first)
        | default('', true)
      }}
    prowlarr_whisparr_id: >-
      {{
        (prowlarr_apps.json
         | selectattr('implementation', 'equalto', 'Whisparr')
         | map(attribute='id')
         | list
         | first)
        | default('', true)
      }}



# desired config bodies (without id) 

- name: Build Sonarr application body
  set_fact:
    prowlarr_sonarr_body:
      name: "Sonarr"
      implementation: "Sonarr"
      configContract: "SonarrSettings"
      enable: true
      syncLevel: "fullSync"
      fields:
        - name: "prowlarrUrl"
          value: "http://gluetun:9696"
        - name: "baseUrl"
          value: "http://sonarr:8989"
        - name: "apiKey"
          value: "{{ sonarr_api_key }}"

- name: Build Radarr application body
  set_fact:
    prowlarr_radarr_body:
      name: "Radarr"
      implementation: "Radarr"
      configContract: "RadarrSettings"
      enable: true
      syncLevel: "fullSync"
      fields:
        - name: "prowlarrUrl"
          value: "http://gluetun:9696"
        - name: "baseUrl"
          value: "http://radarr:7878"
        - name: "apiKey"
          value: "{{ radarr_api_key }}"

- name: Build Whisparr application body
  set_fact:
    prowlarr_whisparr_body:
      name: "Whisparr"
      implementation: "Whisparr"
      configContract: "WhisparrSettings"
      enable: true
      syncLevel: "fullSync"
      fields:
        - name: "prowlarrUrl"
          value: "http://gluetun:9696"
        - name: "baseUrl"
          value: "http://whisparr:6969"
        - name: "apiKey"
          value: "{{ whisparr_api_key }}"


- name: Create Sonarr app in Prowlarr if it does not exist
  when: prowlarr_sonarr_id == ''
  uri:
    url: "http://{{ ansible_host }}:9696/api/v1/applications"
    method: POST
    headers:
      X-Api-Key: "{{ prowlarr_api_key }}"
    body_format: json
    body: "{{ prowlarr_sonarr_body }}"
    status_code: [200, 201]
    return_content: true
  register: prowlarr_sonarr_create

- name: Create Radarr app in Prowlarr if it does not exist
  when: prowlarr_radarr_id == ''
  uri:
    url: "http://{{ ansible_host }}:9696/api/v1/applications"
    method: POST
