         | list
         | first)
        | default('', true)
      }}


- name: build 1337x indexer body
  set_fact:
    prowlarr_1337x_body:
      definitionName: "1337x"
      name: "1337x"
      enable: true
      redirect: false
      implementation: "Cardigann"
      configContract: "CardigannSettings"
      priority: 50
      appProfileId: 1
      fields:
        - name: definitionFile
          value: "1337x"

- name: build EZTV indexer body
  set_fact:
    prowlarr_eztv_body:
      definitionName: "eztv"
      name: "EZTV"
      enable: true
      redirect: false
      implementation: "Cardigann"
      configContract: "CardigannSettings"
      priority: 50
      appProfileId: 1
      fields:
        - name: definitionFile
          value: "eztv"

# MyAnonamouse Freeleech used to run as a separate, ratio-safe indexer for
# automatic grabs while the full MyAnonamouse indexer was interactive-only. Now
# that the full indexer is enabled for automatic search too, keeping both would
# double every search request against MAM's API and risks tripping its rate
# limiter (429s) — see the indexer removal task below.

- name: build MyAnonamouse Indexer body
  set_fact:
    prowlarr_mam_body:
      definitionName: "MyAnonamouse"
      name: "MyAnonamouse"
      enable: true
      # redirect stays false so prowlarr fetches the .torrent itself. Prowlarr is
      # in gluetun's network namespace and the apps that consume it are not; a
      # redirect would make the app fetch from the host IP, which the IP-locked
      # MAM session rejects.
      redirect: false
      implementation: "MyAnonamouse"
      configContract: "MyAnonamouseSettings"
      priority: 10
      appProfileId: 1
      fields:
        - name: "mamId"
          value: "{{ mam_id }}"


- name: build Torrentleech Indexer body
  set_fact:
    prowlarr_torrentleech_body:
      definitionName: "torrentleech"
      name: "TorrentLeech Freeleech"
      enable: true
      redirect: false
      implementation: "Cardigann"
      configContract: "CardigannSettings"
      priority: 2
      appProfileId: 1
      fields:
        - name: definitionFile
          value: "torrentleech"
        - name: username
          value: "{{ torrentleech_username }}"
        - name: password
          value: "{{ torrentleech_password }}"
        - name: freeleech
          value: true


- name: Build 1337x body with ID for update
  when: prowlarr_1337x_id != ''
  set_fact:
    prowlarr_1337x_body_update: "{{ prowlarr_1337x_body | combine({'id': prowlarr_1337x_id}) }}"

- name: Build EZTV body with ID for update
