- name: wait for bookshelf to be up
  uri:
    url: "http://{{ ansible_ssh_host }}:8787/ping"
    method: HEAD
    status_code: 200
  register: bookshelf_ping
  retries: 30
  delay: 2
  until: bookshelf_ping.status == 200

- name: Get bookshelf root folders
  uri:
    url: "http://{{ ansible_ssh_host }}:8787/api/v1/rootfolder"
    method: GET
    headers:
      X-Api-Key: "{{ bookshelf_api_key }}"
    return_content: true
  register: bookshelf_root_folders

- name: Build Bookshelf root folder
  set_fact:
    bookshelf_root_folder_body:
      path: "/data/media/books"
      name: "books"
      defaultQualityProfileId: 1
      defaultMetadataProfileId: 1


- name: Create Bookshelf root folder if it does not exist with this path
  when: >
    (bookshelf_root_folders.json
    | selectattr('path', 'contains', '/data/media/books')
    | list
    | length) == 0
  uri:
    url: "http://{{ ansible_ssh_host }}:8787/api/v1/rootfolder"
    method: POST
    headers:
      X-Api-Key: "{{ bookshelf_api_key }}"
    body_format: json
    body: "{{bookshelf_root_folder_body }}"
    status_code: [200, 201]
    return_content: true
  register: bookshelf_rootfolder_create

- name: Get existing download clients
  uri:
    url: "http://{{ ansible_ssh_host }}:8787/api/v1/downloadclient"
    method: GET
    headers:
      X-Api-Key: "{{ bookshelf_api_key }}"
    return_content: true
  register: bookshelf_downloadclients

- name: Build qBittorrent application body
  set_fact:
    bookshelf_qbittorrent_body:
      name: "qBittorrent"
      enable: true
      protocol: "torrent"
      priority: 1
      removeCompletedDownloads: false
      removeFailedDownloads: true
      fields:
        - name: "host"
          value: "gluetun"
        - name: "port"
          value: 8088
        - name: "useSsl"
          value: false
        - name: "username"
          value: "{{ qbittorrent_username }}"
        - name: "password"
          value: "{{ qbittorrent_password }}"
      implementationName: "qBittorrent"
      implementation: "QBittorrent"
      configContract: "QBittorrentSettings"

- name: Create qbittorrent download client if missing
  when: >
    (bookshelf_downloadclients.json
      | selectattr('implementation', 'equalto', 'QBittorrent')
      | list
      | length) == 0
  uri:
    url: "http://{{ ansible_ssh_host }}:8787/api/v1/downloadclient"
    method: POST
    headers:
      X-Api-Key: "{{ bookshelf_api_key }}"
    body_format: json
    body: "{{ bookshelf_qbittorrent_body }}"
    status_code: [200, 201]
    return_content: true
  register: bookshelf_qbittorrent_create
  ignore_errors: yes


