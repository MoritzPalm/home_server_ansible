- name: Create Tandoor postgres data directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "70"
    group: "70"
    mode: "0700"
  loop:
    - "{{ database_dir }}/tandoor"
    - "{{ database_dir }}/tandoor/pgdata"
  tags:
    - kitchen

- name: Create Tandoor media and compose directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ media_path }}/recipes"
    - "{{ media_path }}/recipes/mediafiles"
    - "{{ compose_root }}/kitchen"
  tags:
    - kitchen

- name: create .env file for kitchen stack
  copy:
    dest: "{{ compose_root }}/kitchen/.env"
    owner: root
    group: docker
    mode: "0640"
    content: |
      HOST_IP={{ host_ip }}
      HOST_TANDOOR={{ tunnel_hosts.tandoor }}
      HOST_AUTHENTIK={{ tunnel_hosts.authentik }}
      OIDC_TANDOOR_SECRET={{ oidc_tandoor_secret }}
      RECIPES_DB_NAME=recipes
      RECIPES_DB_USER=djangodb
      RECIPES_DB_PASSWORD={{ tandoor_postgres_password }}
      RECIPES_SECRET_KEY={{ tandoor_secret_key }}
      CONFIG_PATH={{ config_path }}
      DATABASE_DIR={{ database_dir }}
      MEDIA_PATH={{ media_path }}
      FDC_API_KEY={{ tandoor_fdc_api_key }}
  no_log: true
  tags:
      - kitchen

- name: run kitchen compose file
  community.docker.docker_compose_v2:
    project_src: "{{ compose_root }}/kitchen"
    files: kitchen.yml
  tags:
    - kitchen

- name: Wait for tandoor to become healthy
  community.docker.docker_container_info:
    name: tandoor
  register: tandoor_info
  retries: 30
  delay: 10
  until:
    - tandoor_info.exists
    - tandoor_info.container.State.Health.Status | default('') == 'healthy'
  failed_when: false
  tags:
    - kitchen

- name: Fail if tandoor did not become healthy
  ansible.builtin.fail:
    msg: >-
      tandoor is {{ tandoor_info.container.State.Health.Status
                    | default('not running') }} after 5 minutes.
      Traefik will not route to it. Check: docker logs tandoor
  when: tandoor_info.container.State.Health.Status | default('') != 'healthy'
  tags:
    - kitchen

- name: Seed tandoor open data and import automations
  community.docker.docker_container_exec:
    container: tandoor
    chdir: /opt/recipes
    command: /opt/recipes/venv/bin/python manage.py shell
    stdin: "{{ lookup('template', 'tandoor_bootstrap.py.j2') }}"
  register: tandoor_bootstrap
  changed_when: >-
    (tandoor_bootstrap.stdout
     | regex_search('TANDOOR_BOOTSTRAP_RESULT (.*)', '\\1')
     | first | from_json).changed
  tags:
    - kitchen

- name: Show what the tandoor seed changed
  ansible.builtin.debug:
    msg: >-
      {{ (tandoor_bootstrap.stdout
          | regex_search('TANDOOR_BOOTSTRAP_RESULT (.*)', '\\1')
          | first | from_json) }}
  when: tandoor_bootstrap is changed
  tags:
    - kitchen
