- name: Create .env file for fitness stack
  copy:
    dest: "{{ compose_root }}/fitness/.env"
    owner: root
    group: docker
    mode: "0640"
    content: |
      HOST_IP={{ host_ip }}
      X_API_KEY="{{ hevy_api_key | default(api_key) }}"
      LOG_LEVEL="INFO"
      RECAPTCHA_SITE_KEY="6LfkQG0jAAAAANTrIkVXKPfSPHyJnt4hYPWqxh0R"
      COOKIE_SECURE="false"
  tags:
    - hevy
    - hevy-deploy

- name:  Start Hevy Insights with docker-compose
  community.docker.docker_compose_v2:
    project_src: "{{ compose_root }}/fitness"
    files: fitness.yml
    state: present
  tags:
    - hevy
    - hevy-deploy

- name: Wait for frontend to be healthy
  ansible.builtin.uri:
    url: "http://localhost:{{ frontend_port }}"
    status_code: 200
  register: result
  until: result.status == 200
  retries: 30
  delay: 2
  tags:
    - hevy
    - hevy-deploy
