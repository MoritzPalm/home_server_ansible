---
# Docker's published ports insert their own nat/FORWARD rules and bypass UFW's
# INPUT chain entirely, so the UFW default-deny in roles/base does NOT protect
# any container port. DOCKER-USER is the only hook Docker guarantees to preserve
# and to consult before its own ACCEPT rules, so container ingress policy lives
# here.
#
# IMPORTANT — this host has no separate WAN interface. It sits behind the
# Fritz!Box NAT on a single NIC, so internet traffic arrives DNAT'd on the *same*
# interface as LAN traffic. The DROP is therefore only safe because the
# lan_subnet RETURN precedes it. Reordering these rules would cut off the LAN.
#
# DOCKER-USER hangs off FORWARD, so none of this affects host services: sshd,
# Tailscale and the host itself are on INPUT and cannot be locked out from here.
# The blast radius of a mistake is "a container is unreachable", not "the box is
# gone".

# Provides iptables-restore, used by docker-user-restore.service below. The
# netfilter-persistent service it ships is disabled in the next task.
- name: Install iptables persistence
  ansible.builtin.apt:
    name: iptables-persistent
    state: present
  tags: [firewall]

# netfilter-persistent saves and restores the ENTIRE ruleset, including the nat
# chains docker and tailscale generate at runtime. On boot it reinstates DNAT
# entries pointing at container addresses from the previous boot, which take
# precedence over the correct ones docker has just written — every published
# port bound to a specific host address then refuses connections, while ports
# bound to 0.0.0.0 keep working. Diagnosing that from the symptom is miserable.
#
# DOCKER-USER is persisted instead by docker-user-restore.service, which touches
# only that chain. Everything else is owned by the daemon that created it and is
# rebuilt on start.
- name: Disable netfilter-persistent
  ansible.builtin.systemd:
    name: netfilter-persistent
    enabled: false
    state: stopped
  failed_when: false
  tags: [firewall]

# Removes an earlier drop-in that put After=docker.service on
# netfilter-persistent. That unit is Before=network-pre.target and docker is
# After=network-online.target, so the drop-in closed an ordering cycle. systemd
# broke the cycle by deleting containerd.service/start — containerd never
# started, and because docker only Wants (not Requires) it, docker came up and
# every container operation failed with "dial containerd.sock: timeout".
#
# Latent until the first reboot after it was installed.
- name: Remove the netfilter-persistent drop-in that caused an ordering cycle
  ansible.builtin.file:
    path: /etc/systemd/system/netfilter-persistent.service.d/after-docker.conf
    state: absent
  notify: Reload systemd
  tags: [firewall]

# The problem the drop-in was solving is real: docker recreates DOCKER-USER when
# the daemon starts, discarding rules netfilter-persistent restored earlier in
# boot. Solved here with a separate unit ordered after docker, which adds no
# constraint to netfilter-persistent's own position in the boot sequence and so
# cannot create a cycle.
- name: Install DOCKER-USER restore unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/docker-user-restore.service
    mode: "0644"
    content: |
      # Managed by Ansible (roles/firewall) — edits are overwritten.
      [Unit]
      Description=Replay saved DOCKER-USER rules after docker starts
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      # Restores ONLY the DOCKER-USER chain, from a file this role generates.
      # /etc/iptables/rules.v4 is not usable here: it holds docker's own
      # generated chains too, and replaying those after docker has rebuilt them
      # duplicates every rule. -n (noflush) leaves the rest of the table alone.
      #
      # The flush is a separate ExecStartPre rather than a "-F DOCKER-USER" line
      # in the file: iptables-restore rejects -F as a rule line ("Bad argument
      # `DOCKER-USER'"), and --noflush means the ":DOCKER-USER - [0:0]" header
      # creates the chain without emptying it. Leading "-" so a missing chain on
      # first boot is not an error.
      ExecStartPre=-/sbin/iptables -F DOCKER-USER
      ExecStartPre=-/sbin/ip6tables -F DOCKER-USER
      ExecStart=/sbin/iptables-restore -n /etc/iptables/docker-user.v4
      ExecStart=/sbin/ip6tables-restore -n /etc/iptables/docker-user.v6
      # iptables-restore exits 0 for a file containing no rules, so success here
      # does not mean the chain was populated — and an empty DOCKER-USER is an
      # open firewall that looks healthy in systemctl status. Assert the DROP
      # actually landed.
      ExecStartPost=/bin/sh -c '/sbin/iptables -S DOCKER-USER | grep -q -- "-j DROP"'
      ExecStartPost=/bin/sh -c '/sbin/ip6tables -S DOCKER-USER | grep -q -- "-j DROP"'

      [Install]
      WantedBy=multi-user.target
  notify: Reload systemd
  tags: [firewall]

- name: Enable DOCKER-USER restore unit
  ansible.builtin.systemd:
    name: docker-user-restore.service
    enabled: true
    daemon_reload: true
  tags: [firewall]

# Rule order is the security property here, not just style: the lan_subnet /
# link-local RETURNs must precede the interface DROP, because on this host LAN
# and internet traffic share one NIC.
- name: Build desired DOCKER-USER ruleset
  ansible.builtin.set_fact:
    docker_user_rules_v4: >-
      {{ ban_chain_jump
         + ['-m conntrack --ctstate RELATED,ESTABLISHED -j RETURN',
            '-i ' ~ tailscale_if ~ ' -j RETURN',
            '-i lo -j RETURN',
            '-s ' ~ lan_subnet ~ ' -j RETURN']
         + wan_port_rules_v4
         + ['-i ' ~ wan_if ~ ' -j DROP'] }}
    docker_user_rules_v6: >-
      {{ ban_chain_jump
         + ['-m conntrack --ctstate RELATED,ESTABLISHED -j RETURN',
            '-i ' ~ tailscale_if ~ ' -j RETURN',
            '-i lo -j RETURN',
            '-s fe80::/10 -j RETURN',
            '-s fc00::/7 -j RETURN']
         + wan_port_rules_v6
         + ['-i ' ~ wan_if_v6 ~ ' -j DROP'] }}
  vars:
    # First rule, ahead of the conntrack RETURN, so bans also drop traffic on
    # connections that are already established.
    ban_chain_jump: "{{ ['-j ' ~ firewall_ban_chain] if plex_fail2ban_enabled else [] }}"
    # "-m tcp" is spelled out because `iptables -S` prints that inferred form,
    # and the idempotence check below compares against its output. Omitting it
    # makes every run flush and rebuild the chain.
    wan_port_rules_v4: "{{ wan_allowed_container_ports
      | map(attribute='port')
      | map('string')
      | map('regex_replace', '^', '-i ' ~ wan_if ~ ' -p tcp -m tcp --dport ')
      | map('regex_replace', '$', ' -j RETURN')
      | list }}"
    wan_port_rules_v6: "{{ wan_allowed_container_ports
      | map(attribute='port')
      | map('string')
      | map('regex_replace', '^', '-i ' ~ wan_if_v6 ~ ' -p tcp -m tcp --dport ')
      | map('regex_replace', '$', ' -j RETURN')
      | list }}"
  tags: [firewall]

- name: Read current DOCKER-USER chain
  ansible.builtin.command: "{{ item.cmd }} -S DOCKER-USER"
  register: docker_user_current
  changed_when: false
  failed_when: false
  loop:
    - { cmd: iptables, family: v4 }
    - { cmd: ip6tables, family: v6 }
  loop_control:
    label: "{{ item.family }}"
  tags: [firewall]

# Must exist before the rebuild appends a jump to it. Otherwise the `set -e`
# shell aborts partway and leaves DOCKER-USER without its trailing DROP.
- name: Create fail2ban ban chain if absent
  ansible.builtin.command: "{{ item }} -N {{ firewall_ban_chain }}"
  register: firewall_ban_chain_created
  changed_when: firewall_ban_chain_created.rc == 0
  failed_when:
    - firewall_ban_chain_created.rc != 0
    - "'exists' not in firewall_ban_chain_created.stderr"
  when: plex_fail2ban_enabled
  loop: [iptables, ip6tables]
  tags: [firewall]

# Flush and rebuild in a single shell invocation so the window where the chain
# is empty (and therefore permissive) is microseconds rather than one task per
# rule. Only runs when the chain does not already match, so a converged host is
# reported unchanged.
- name: Apply DOCKER-USER ruleset
  ansible.builtin.shell:
    cmd: |
      set -e
      {{ item.cmd }} -F DOCKER-USER
      {% for rule in item.rules %}
      {{ item.cmd }} -A DOCKER-USER {{ rule }}
      {% endfor %}
  when:
    - firewall_docker_user_enabled
    - (item.current.stdout_lines | default([]) | reject('search', '^-N ') | list)
      != (item.rules | map('regex_replace', '^(.*)$', '-A DOCKER-USER \\1') | list)
  loop:
    - cmd: iptables
      rules: "{{ docker_user_rules_v4 }}"
      current: "{{ docker_user_current.results[0] }}"
    - cmd: ip6tables
      rules: "{{ docker_user_rules_v6 }}"
      current: "{{ docker_user_current.results[1] }}"
  loop_control:
    label: "{{ item.cmd }}"
  tags: [firewall]

# Consumed by docker-user-restore.service on boot. Generated from the same facts
# as the live ruleset, so the two cannot drift.
#
# ":chain - [0:0]" with --noflush creates the chain if absent without emptying
# it — which is why f2b-plex is declared here but its bans survive. The explicit
# "-F DOCKER-USER" is what makes this idempotent on re-runs.
- name: Write DOCKER-USER restore files
  ansible.builtin.copy:
    dest: "/etc/iptables/docker-user.{{ item.family }}"
    owner: root
    group: root
    mode: "0640"
    # One join rather than {% %} blocks or conditional line fragments: block tags
    # emit stray blank lines unless trim_blocks is on, and iptables-restore
    # rejects blank lines. No "-F DOCKER-USER" line — the unit flushes with the
    # iptables binary first, because iptables-restore rejects -F as a rule.
    content: |
      # Managed by Ansible (roles/firewall) — edits are overwritten.
      *filter
      {{ ([':DOCKER-USER - [0:0]']
          + ([':' ~ firewall_ban_chain ~ ' - [0:0]'] if plex_fail2ban_enabled else [])
          + (item.rules | map('regex_replace', '^', '-A DOCKER-USER ') | list))
         | join('\n') }}
      COMMIT
  loop:
    - { family: v4, rules: "{{ docker_user_rules_v4 }}" }
    - { family: v6, rules: "{{ docker_user_rules_v6 }}" }
  loop_control:
    label: "{{ item.family }}"
  when: firewall_docker_user_enabled
  tags: [firewall]

- name: Tear down DOCKER-USER ruleset (rollback path)
  ansible.builtin.command: "{{ item }} -F DOCKER-USER"
  when: not firewall_docker_user_enabled
  loop: [iptables, ip6tables]
  tags: [firewall, never]

# --- Plex fail2ban jail -----------------------------------------------------
# fail2ban itself is installed and enabled by roles/base, which runs earlier in
# site.yml; this only adds the Plex jail and the DOCKER-USER-aware action.

- name: Install DOCKER-USER fail2ban action
  ansible.builtin.copy:
    src: fail2ban-action-docker-user.conf
    dest: /etc/fail2ban/action.d/docker-user.conf
    owner: root
    group: root
    mode: "0644"
  when: plex_fail2ban_enabled
  notify: Restart fail2ban
  tags: [firewall, fail2ban]

- name: Install Plex fail2ban filter
  ansible.builtin.copy:
    src: fail2ban-filter-plex-auth.conf
    dest: /etc/fail2ban/filter.d/plex-auth.conf
    owner: root
    group: root
    mode: "0644"
  when: plex_fail2ban_enabled
  notify: Restart fail2ban
  tags: [firewall, fail2ban]

- name: Create directory for the space-free Plex log symlink
  ansible.builtin.file:
    path: "{{ plex_log_link | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: plex_fail2ban_enabled
  tags: [firewall, fail2ban]

# Points at the path, not the inode, so Plex's rotation leaves the link valid
# and fail2ban reopens on the inode change.
- name: Link Plex log to a path without spaces
  ansible.builtin.file:
    src: "{{ plex_log_path }}"
    dest: "{{ plex_log_link }}"
    state: link
    force: true
    follow: false
  when: plex_fail2ban_enabled
  notify: Restart fail2ban
  tags: [firewall, fail2ban]

- name: Install Plex fail2ban jail
  ansible.builtin.template:
    src: fail2ban-jail-plex.local.j2
    dest: /etc/fail2ban/jail.d/plex.local
    owner: root
    group: root
    mode: "0644"
  when: plex_fail2ban_enabled
  notify: Restart fail2ban
  tags: [firewall, fail2ban]

- name: Remove Plex fail2ban jail when disabled
  ansible.builtin.file:
    path: /etc/fail2ban/jail.d/plex.local
    state: absent
  when: not plex_fail2ban_enabled
  notify: Restart fail2ban
  tags: [firewall, fail2ban]

# fail2ban refuses to start if any jail's logpath resolves to nothing, so a
# broken symlink here takes the sshd jail down with it.
- name: Verify Plex log symlink resolves
  ansible.builtin.stat:
    path: "{{ plex_log_link }}"
    follow: true
  register: plex_log_stat
  when: plex_fail2ban_enabled
  tags: [firewall, fail2ban]

- name: Fail if the Plex log is missing
  ansible.builtin.fail:
    msg: >-
      {{ plex_log_link }} does not resolve to a file
      (expected target: {{ plex_log_path }}).
      fail2ban would fail to start, taking the sshd jail down with it.
  when:
    - plex_fail2ban_enabled
    - not (plex_log_stat.stat.exists | default(false))
  tags: [firewall, fail2ban]
