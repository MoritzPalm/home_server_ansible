---
# Docker's published ports insert their own nat/FORWARD rules and bypass UFW's
# INPUT chain entirely, so the UFW default-deny in roles/base does NOT protect
# any container port. DOCKER-USER is the only hook Docker guarantees to preserve
# and to consult before its own ACCEPT rules, so container ingress policy lives
# here.
#
# IMPORTANT — this host has no separate WAN interface. It sits behind the
# Fritz!Box NAT on a single NIC, so internet traffic arrives DNAT'd on the *same*
# interface as LAN traffic. The DROP is therefore only safe because the
# lan_subnet RETURN precedes it. Reordering these rules would cut off the LAN.
#
# DOCKER-USER hangs off FORWARD, so none of this affects host services: sshd,
# Tailscale and the host itself are on INPUT and cannot be locked out from here.
# The blast radius of a mistake is "a container is unreachable", not "the box is
# gone".

- name: Install iptables persistence
  ansible.builtin.apt:
    name: iptables-persistent
    state: present
  tags: [firewall]

- name: Ensure systemd drop-in dir exists
  ansible.builtin.file:
    path: /etc/systemd/system/netfilter-persistent.service.d
    state: directory
    mode: "0755"
  tags: [firewall]

# Docker recreates DOCKER-USER on daemon restart. Ordering netfilter-persistent
# after docker means the saved rules are replayed once the chain exists again,
# rather than into a chain Docker is about to clobber.
- name: Order netfilter-persistent after docker
  ansible.builtin.copy:
    dest: /etc/systemd/system/netfilter-persistent.service.d/after-docker.conf
    mode: "0644"
    content: |
      [Unit]
      After=docker.service
      Wants=docker.service
  notify: Reload systemd
  tags: [firewall]

# Rule order is the security property here, not just style: the lan_subnet /
# link-local RETURNs must precede the interface DROP, because on this host LAN
# and internet traffic share one NIC.
- name: Build desired DOCKER-USER ruleset
  ansible.builtin.set_fact:
    docker_user_rules_v4: >-
      {{ ban_chain_jump
         + ['-m conntrack --ctstate RELATED,ESTABLISHED -j RETURN',
            '-i ' ~ tailscale_if ~ ' -j RETURN',
            '-i lo -j RETURN',
            '-s ' ~ lan_subnet ~ ' -j RETURN']
         + wan_port_rules_v4
         + ['-i ' ~ wan_if ~ ' -j DROP'] }}
    docker_user_rules_v6: >-
      {{ ban_chain_jump
         + ['-m conntrack --ctstate RELATED,ESTABLISHED -j RETURN',
            '-i ' ~ tailscale_if ~ ' -j RETURN',
            '-i lo -j RETURN',
            '-s fe80::/10 -j RETURN',
            '-s fc00::/7 -j RETURN']
         + wan_port_rules_v6
         + ['-i ' ~ wan_if_v6 ~ ' -j DROP'] }}
  vars:
    # First rule, ahead of the conntrack RETURN, so bans also drop traffic on
    # connections that are already established.
    ban_chain_jump: "{{ ['-j ' ~ firewall_ban_chain] if plex_fail2ban_enabled else [] }}"
    # "-m tcp" is spelled out because `iptables -S` prints that inferred form,
    # and the idempotence check below compares against its output. Omitting it
    # makes every run flush and rebuild the chain.
    wan_port_rules_v4: "{{ wan_allowed_container_ports
      | map(attribute='port')
      | map('string')
      | map('regex_replace', '^', '-i ' ~ wan_if ~ ' -p tcp -m tcp --dport ')
      | map('regex_replace', '$', ' -j RETURN')
      | list }}"
    wan_port_rules_v6: "{{ wan_allowed_container_ports
      | map(attribute='port')
      | map('string')
      | map('regex_replace', '^', '-i ' ~ wan_if_v6 ~ ' -p tcp -m tcp --dport ')
      | map('regex_replace', '$', ' -j RETURN')
      | list }}"
  tags: [firewall]

- name: Read current DOCKER-USER chain
  ansible.builtin.command: "{{ item.cmd }} -S DOCKER-USER"
  register: docker_user_current
  changed_when: false
  failed_when: false
  loop:
    - { cmd: iptables, family: v4 }
    - { cmd: ip6tables, family: v6 }
  loop_control:
    label: "{{ item.family }}"
  tags: [firewall]

# Must exist before the rebuild appends a jump to it. Otherwise the `set -e`
# shell aborts partway and leaves DOCKER-USER without its trailing DROP.
- name: Create fail2ban ban chain if absent
  ansible.builtin.command: "{{ item }} -N {{ firewall_ban_chain }}"
  register: firewall_ban_chain_created
  changed_when: firewall_ban_chain_created.rc == 0
  failed_when:
    - firewall_ban_chain_created.rc != 0
    - "'exists' not in firewall_ban_chain_created.stderr"
  when: plex_fail2ban_enabled
  loop: [iptables, ip6tables]
  tags: [firewall]

# Flush and rebuild in a single shell invocation so the window where the chain
# is empty (and therefore permissive) is microseconds rather than one task per
# rule. Only runs when the chain does not already match, so a converged host is
# reported unchanged.
- name: Apply DOCKER-USER ruleset
  ansible.builtin.shell:
    cmd: |
      set -e
      {{ item.cmd }} -F DOCKER-USER
      {% for rule in item.rules %}
      {{ item.cmd }} -A DOCKER-USER {{ rule }}
      {% endfor %}
  when:
    - firewall_docker_user_enabled
    - (item.current.stdout_lines | default([]) | reject('search', '^-N ') | list)
      != (item.rules | map('regex_replace', '^(.*)$', '-A DOCKER-USER \\1') | list)
  loop:
    - cmd: iptables
      rules: "{{ docker_user_rules_v4 }}"
      current: "{{ docker_user_current.results[0] }}"
    - cmd: ip6tables
      rules: "{{ docker_user_rules_v6 }}"
      current: "{{ docker_user_current.results[1] }}"
  loop_control:
    label: "{{ item.cmd }}"
  notify: Persist netfilter rules
  tags: [firewall]

- name: Tear down DOCKER-USER ruleset (rollback path)
  ansible.builtin.command: "{{ item }} -F DOCKER-USER"
  when: not firewall_docker_user_enabled
  loop: [iptables, ip6tables]
  notify: Persist netfilter rules
  tags: [firewall, never]

# --- Plex fail2ban jail -----------------------------------------------------
# fail2ban itself is installed and enabled by roles/base, which runs earlier in
# site.yml; this only adds the Plex jail and the DOCKER-USER-aware action.

- name: Install DOCKER-USER fail2ban action
  ansible.builtin.copy:
    src: fail2ban-action-docker-user.conf
    dest: /etc/fail2ban/action.d/docker-user.conf
    owner: root
    group: root
    mode: "0644"
  when: plex_fail2ban_enabled
  notify: Restart fail2ban
  tags: [firewall, fail2ban]

- name: Install Plex fail2ban filter
  ansible.builtin.copy:
    src: fail2ban-filter-plex-auth.conf
    dest: /etc/fail2ban/filter.d/plex-auth.conf
    owner: root
    group: root
    mode: "0644"
  when: plex_fail2ban_enabled
  notify: Restart fail2ban
  tags: [firewall, fail2ban]

- name: Create directory for the space-free Plex log symlink
  ansible.builtin.file:
    path: "{{ plex_log_link | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: plex_fail2ban_enabled
  tags: [firewall, fail2ban]

# Points at the path, not the inode, so Plex's rotation leaves the link valid
# and fail2ban reopens on the inode change.
- name: Link Plex log to a path without spaces
  ansible.builtin.file:
    src: "{{ plex_log_path }}"
    dest: "{{ plex_log_link }}"
    state: link
    force: true
    follow: false
  when: plex_fail2ban_enabled
  notify: Restart fail2ban
  tags: [firewall, fail2ban]

- name: Install Plex fail2ban jail
  ansible.builtin.template:
    src: fail2ban-jail-plex.local.j2
    dest: /etc/fail2ban/jail.d/plex.local
    owner: root
    group: root
    mode: "0644"
  when: plex_fail2ban_enabled
  notify: Restart fail2ban
  tags: [firewall, fail2ban]

- name: Remove Plex fail2ban jail when disabled
  ansible.builtin.file:
    path: /etc/fail2ban/jail.d/plex.local
    state: absent
  when: not plex_fail2ban_enabled
  notify: Restart fail2ban
  tags: [firewall, fail2ban]

# fail2ban refuses to start if any jail's logpath resolves to nothing, so a
# broken symlink here takes the sshd jail down with it.
- name: Verify Plex log symlink resolves
  ansible.builtin.stat:
    path: "{{ plex_log_link }}"
    follow: true
  register: plex_log_stat
  when: plex_fail2ban_enabled
  tags: [firewall, fail2ban]

- name: Fail if the Plex log is missing
  ansible.builtin.fail:
    msg: >-
      {{ plex_log_link }} does not resolve to a file
      (expected target: {{ plex_log_path }}).
      fail2ban would fail to start, taking the sshd jail down with it.
  when:
    - plex_fail2ban_enabled
    - not (plex_log_stat.stat.exists | default(false))
  tags: [firewall, fail2ban]
