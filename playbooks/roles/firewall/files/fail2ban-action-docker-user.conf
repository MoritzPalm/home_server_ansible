# Managed by Ansible (roles/firewall) — edits on the host are overwritten.
#
# Docker's published ports are DNAT'd through FORWARD and never traverse INPUT,
# where fail2ban's stock iptables actions write. Bans for a containerised
# service must land in a chain reachable from DOCKER-USER instead.
#
# This action does not create or delete the DOCKER-USER jump; roles/firewall
# owns it and rebuilds DOCKER-USER on every run.
#
# actionstop flushes rather than deletes: DOCKER-USER holds a jump to this
# chain, and a dangling reference breaks the next rebuild.

[Definition]

actionstart = <iptables> -N <chain_f2b> 2>/dev/null || true
actionstop  = <iptables> -F <chain_f2b> 2>/dev/null || true
actioncheck = <iptables> -n -L <chain_f2b> >/dev/null
actionban   = <iptables> -I <chain_f2b> 1 -s <ip> -j DROP
actionunban = <iptables> -D <chain_f2b> -s <ip> -j DROP

[Init]

name      = default
chain_f2b = f2b-<name>
iptables  = iptables -w

# IPv6 bans go to the ip6tables chain of the same name. Without this section
# fail2ban passes v6 addresses to iptables, which rejects them at ban time;
# the failure appears only in fail2ban.log.
[Init?family=inet6]

iptables = ip6tables -w
