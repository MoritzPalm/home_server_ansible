# Managed by Ansible (roles/firewall) — edits on the host are overwritten.
#
# fail2ban's stock iptables actions insert into INPUT. Docker's published ports
# are DNAT'd and traverse FORWARD, never INPUT, so a stock jail against a
# containerised service reports bans it is not actually enforcing — the same
# trap that makes the UFW default-deny in roles/base useless for containers.
#
# This action therefore writes into a chain reachable from DOCKER-USER, and
# deliberately does NOT create or delete the jump itself. roles/firewall owns
# that jump, because it flushes and rebuilds DOCKER-USER on every run; a jump
# inserted from here would be silently removed on the next playbook run and
# every subsequent ban would be a no-op. Flushing DOCKER-USER does not touch
# this chain, so bans survive a playbook run.
#
# actionstop flushes rather than deletes: the chain must outlive fail2ban
# restarts because DOCKER-USER holds a jump to it. Deleting it would leave a
# dangling reference and the next rebuild would fail.

[Definition]

actionstart = <iptables> -N <chain_f2b> 2>/dev/null || true
actionstop  = <iptables> -F <chain_f2b> 2>/dev/null || true
actioncheck = <iptables> -n -L <chain_f2b> >/dev/null
actionban   = <iptables> -I <chain_f2b> 1 -s <ip> -j DROP
actionunban = <iptables> -D <chain_f2b> -s <ip> -j DROP

[Init]

name      = default
chain_f2b = f2b-<name>
iptables  = iptables -w

# Banned IPv6 addresses must go into the ip6tables chain of the same name.
# Without this section fail2ban would hand a v6 address to iptables, which
# rejects it, and the ban would fail at execution time rather than at config
# time — visible only in fail2ban.log.
[Init?family=inet6]

iptables = ip6tables -w
