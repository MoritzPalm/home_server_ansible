# Managed by Ansible (roles/firewall) — edits on the host are overwritten.
#
# Plex does not log a "login failed" string at default verbosity. The only auth
# signal it emits is the HTTP status on its request-completion lines, so this
# matches 401s. Sample line the regex is built against:
#
#   Aug 03, 2026 09:23:14.445 [128932298324792] DEBUG - Completed: \
#     [100.78.47.28:49596] 401 GET / (16 live) #10e TLS GZIP 0ms 464 bytes
#
# Verified on this host that the bracketed address is the REAL client IP for
# remote connections — public addresses appear there, not the Docker bridge
# gateway — which is what makes banning on it meaningful. Re-check that after
# any change to Docker's userland-proxy setting.
#
# 401s occur in normal operation: clients routinely probe an endpoint before
# presenting their token. This is a blunt instrument for someone hammering the
# port, which is why the jail pairs it with a high maxretry and puts every
# trusted network in ignoreip. Do not lower maxretry without re-reading the log.
#
# IPv6: Plex renders the peer as [addr:port] for v4 and the same way for v6, so
# a v6 address is ambiguous to split on ":". The second failregex handles the
# bracketed-v6 form; if v6 bans ever misfire, check fail2ban-regex output first.

[Definition]

failregex = ^.*Completed: \[<HOST>:\d+\]\s+401\s
            ^.*Completed: \[<HOST>\]\s+401\s

ignoreregex =

# Plex's timestamp is "Aug 03, 2026 09:23:14.445". The fractional seconds are
# left off the pattern deliberately — fail2ban matches the prefix, and dropping
# %f avoids depending on its fractional-second support.
datepattern = ^%%b %%d, %%Y %%H:%%M:%%S
