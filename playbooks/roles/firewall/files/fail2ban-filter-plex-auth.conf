# Managed by Ansible (roles/firewall) — edits on the host are overwritten.
#
# Plex logs no authentication-failure string at default verbosity. The HTTP
# status on request-completion lines is the only auth signal:
#
#   Aug 03, 2026 09:23:14.445 [128932298324792] DEBUG - Completed: \
#     [100.78.47.28:49596] 401 GET / (16 live) #10e TLS GZIP 0ms 464 bytes
#
# The bracketed address is the real client IP for remote connections, verified
# on this host. That holds only while Docker preserves the source address;
# re-check after any change to its userland-proxy setting.
#
# 401s occur in normal operation, since clients probe endpoints before
# presenting a token. The jail compensates with a high maxretry and a broad
# ignoreip rather than this filter being selective.
#
# The second failregex covers peers logged without a port, including IPv6.

[Definition]

failregex = ^.*Completed: \[<HOST>:\d+\]\s+401\s
            ^.*Completed: \[<HOST>\]\s+401\s

ignoreregex =

# Plex timestamp: "Aug 03, 2026 09:23:14.445". Fractional seconds are omitted;
# fail2ban matches on the prefix.
datepattern = ^%%b %%d, %%Y %%H:%%M:%%S
