---
# Interface facing the internet. Derived from the default route rather than
# hardcoded so a NIC rename does not silently turn the DROP rule into a no-op.
wan_if: "{{ ansible_default_ipv4.interface }}"
wan_if_v6: "{{ (ansible_default_ipv6 | default({})).interface | default(wan_if) }}"


# Tailscale interface — always trusted, this is how Ansible and every admin UI
# reach the host.
tailscale_if: tailscale0

# Set false to tear the rules down (rollback path documented in the plan).
firewall_docker_user_enabled: true

# --- Dynamic bans -----------------------------------------------------------
#
# Plex has no reverse proxy in front of it, so CrowdSec cannot see its traffic.
# This jail is the only intrusion detection on that port.
#
# Ownership is split: this role owns the ban chain and the DOCKER-USER jump,
# fail2ban owns only the rules inside the chain. Rebuilding DOCKER-USER would
# delete a jump fail2ban had inserted; flushing it does not touch a separate
# chain, so live bans survive a playbook run.
plex_fail2ban_enabled: true
plex_fail2ban_name: plex
firewall_ban_chain: "f2b-{{ plex_fail2ban_name }}"

plex_log_path: "{{ config_path }}/plex/Library/Application Support/Plex Media Server/Logs/Plex Media Server.log"

# fail2ban cannot read a logpath containing spaces: jailreader.py splits the
# last space-separated token off as a head/tail modifier without checking that
# it is one, so Plex's path globs to ".../Logs/Plex Media" and the server
# refuses to start. Hence a space-free symlink.
plex_log_link: /var/log/plex/pms.log

# Tolerant by design: Plex emits 401s in normal operation, so this catches
# sustained hammering rather than individual failed logins.
plex_fail2ban_maxretry: 10
plex_fail2ban_findtime: 600
plex_fail2ban_bantime: 3600
