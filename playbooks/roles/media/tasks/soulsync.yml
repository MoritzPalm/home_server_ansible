- name: Create config dirs for apps
  file:
    path: "{{ config_path }}/soulsync"
    state: directory
    owner: "{{ admin_user }}"
    group: docker
    mode: "0775"
  tags:
    - music
    - soulsync

# soulsync reads config.json only at startup, so a change here has to be
# followed by a restart to take effect.
- name: create soulsync config from template FIRST
  ansible.builtin.template:
    src: templates/soulsync_config.json.j2
    dest: "{{ config_path }}/soulsync/config.json"
    owner: "{{ admin_user }}"
    group: docker
    mode: "0640"
  notify: Restart soulsync
  tags:
    - media
    - soulsync

- name: Create database dir for soulsync
  file:
    path: "{{ database_dir }}/soulsync"
    state: directory
    owner: "{{ admin_user }}"
    group: docker
    mode: "0775"
  tags:
    - media
    - soulsync

# There used to be a task here that deleted music_library.db whenever the
# config changed, to force a re-migration. Never do that: the schema is created
# only at startup, so deleting the file under a running container leaves a
# schema-less database and every page fails with "no such table: artists" — and
# it destroys the scanned library (1.6 GB, ~1300 artists) along the way. The
# restart handler above is what actually reloads the config.

