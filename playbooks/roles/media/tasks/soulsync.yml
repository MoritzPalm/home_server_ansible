- name: Create config dirs for apps
  file:
    path: "{{ config_path }}/soulsync"
    state: directory
    owner: "{{ admin_user }}"
    group: docker
    mode: "0775"
  tags:
    - music
    - soulsync

- name: create soulsync config from template FIRST
  ansible.builtin.template:
    src: soulsync_config.json.j2
    dest: "{{ config_path }}/soulsync/config.json"
    owner: "{{ admin_user }}"
    group: docker
    mode: "0640"
  register: soulsync_config_changed
  tags:
    - media
    - soulsync

- name: Create database dir for soulsync
  file:
    path: "{{ database_dir }}/soulsync"
    state: directory
    owner: "{{ admin_user }}"
    group: docker
    mode: "0775"
  tags:
    - media
    - soulsync

# CRITICAL: Remove database when config changes to force re-migration
- name: Remove existing soulsync database to force config reload
  ansible.builtin.file:
    path: "{{ database_dir }}/soulsync/music_library.db"
    state: absent
  when: soulsync_config_changed.changed
  tags:
    - media
    - soulsync

