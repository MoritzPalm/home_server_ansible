- name: Configure jellyfin
  ansible.builtin.import_tasks: jellyfin.yml
  tags:
    - media
    - media-jellyfin

- name: Configure stash
  ansible.builtin.import_tasks: stash.yml
  tags:
    - media
    - media-stash

- name: Configure plex
  ansible.builtin.import_tasks: plex.yml
  tags:
    - media
    - media-plex

- name: Configure soulsync
  ansible.builtin.import_tasks: soulsync.yml
  tags:
    - media
    - media-soulsync

- name: Configure multi-scrobbler
  ansible.builtin.import_tasks: multi_scrobbler.yml
  tags:
    - media
    - media-multi-scrobbler

- name: Create immich config directory
  ansible.builtin.file:
    path: "{{ config_path }}/immich"
    state: directory
    owner: "{{ admin_user }}"
    group: docker
    mode: "0750"
  tags: [media]

# Docker creates a missing bind-mount source as a DIRECTORY, which then
# shadows the real file forever — the same trap that silently disabled
# vikunja's OIDC.
- name: Check immich config path
  ansible.builtin.stat:
    path: "{{ config_path }}/immich/config.json"
  register: immich_config_path
  tags: [media]

- name: Remove immich config.json if docker created it as a directory
  ansible.builtin.file:
    path: "{{ config_path }}/immich/config.json"
    state: absent
  when: immich_config_path.stat.exists and immich_config_path.stat.isdir
  tags: [media]

- name: Render immich system config
  ansible.builtin.template:
    src: immich-config.json.j2
    dest: "{{ config_path }}/immich/config.json"
    # immich runs as uid 1000 in this image; root-owned it would be unreadable
    # and immich would fall back to defaults with OAuth off.
    owner: "1000"
    group: docker
    mode: "0640"
  no_log: true
  tags: [media]

- name: Create .env file for media stack
  copy:
    dest: "{{ compose_root }}/media/.env"
    owner: root
    group: docker
    mode: "0640"
    content: |
      HOST_IP={{ host_ip }}
      LAN_IP={{ lan_ip }}
      HOST_IMMICH={{ tunnel_hosts.immich }}
      PLEX_CLAIM={{ plex_claim }}
      MEDIA_PATH={{ media_path }}
      CONFIG_PATH={{ config_path }}
      DOWNLOADS_PATH={{ downloads_path }}
      LOG_DIR={{ log_dir }}
      STORAGE_DIR={{ storage_path }}
      DATABASE_DIR={{ database_dir }}
      SOULSEEK_PATH={{ soulseek_path }}
      UPLOAD_LOCATION={{ media_path }}/photos
      DB_USERNAME=postgres
      DB_DATABASE_NAME=immich
      DB_DATA_LOCATION={{ database_dir }}/immich
      DB_PASSWORD={{ immich_db_password }}
      MS_SPOTIFY_CLIENT_ID={{ ms_spotify_client_id }}
      MS_SPOTIFY_CLIENT_SECRET={{ ms_spotify_client_secret }}
      MS_PLEX_TOKEN={{ plex_token }}
      MS_PLEX_USER={{ ms_plex_user }}
      MS_LISTENBRAINZ_TOKEN={{ ms_listenbrainz_token }}
      MS_LISTENBRAINZ_USER={{ ms_listenbrainz_user }}
  tags:
    - media

- name: Run media.yml compose file
  community.docker.docker_compose_v2:
    project_src: "{{ compose_root }}/media"
    files: "media.yml"
  tags:
    - media