- name: Set timezone
  timezone: { name: "{{ timezone }}" }

- name: Base packages present
  apt:
    name: [ca-certificates, curl, gnupg, ufw, fail2ban, unattended-upgrades, tmux, htop, git, tree, plocate, apparmor, apparmor-utils]
    state: present
    update_cache: true

- name: Install admin authorized_keys
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ item }}"
    state: present
  loop: "{{ admin_ssh_public_keys }}"


- name: Persist sshd privsep dir across reboots
  copy:
    dest: /etc/tmpfiles.d/sshd.conf
    mode: "0644"
    content: "d /run/sshd 0755 root root -\n"

- name: Ensure sshd privsep dir exists now
  file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"
  notify: Validate & Restart ssh

- name: SSH hardening
  copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    mode: "0644"
    content: |
      PermitRootLogin prohibit-password
      PubkeyAuthentication yes
      ChallengeResponseAuthentication no
      KbdInteractiveAuthentication no
      UsePAM yes
      PasswordAuthentication no
  notify: Validate & Restart ssh

- name: UFW allow SSH and enable
  ufw: { rule: allow, name: OpenSSH }
- ufw: { state: enabled, policy: deny }

- name: Enable fail2ban for sshd
  copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    mode: "0644"
    content: |
      [DEFAULT]
      ignoreip = 127.0.0.1/8 ::1 100.64.0.0/10
      [sshd]
      enabled = true
      port = ssh
      maxretry = 4
      backend = systemd
  notify: Restart fail2ban

- name: Enable unattended security upgrades
  copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";

- name: Configure what unattended-upgrades is allowed to install
  copy:
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    mode: "0644"
    content: |
      Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";

- name: Ensure the APT timers are actually running
  systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Verify unattended-upgrades would run
  ansible.builtin.command: unattended-upgrades --dry-run --debug
  register: base_unattended_dryrun
  changed_when: false
  failed_when: base_unattended_dryrun.rc != 0

- name: Disable and mask unused Samba services
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
    masked: true
  loop:
    - smbd
    - nmbd
  failed_when: false

- name: Create compose root
  file: { path: "{{ compose_root }}", state: directory, owner: "{{ admin_user }}", group: docker, mode: "0775" }

- name: Convenience dirs
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ admin_user }}"
    group: docker
    mode: "0775"
  loop:
    - /srv/data/configs
    - /srv/data/db
    - /srv/data/cache

- name: Create config dirs for apps
  file:
    path: "{{ config_path }}"
    state: directory
    owner: "{{ admin_user }}"
    group: docker
    mode: "0775"