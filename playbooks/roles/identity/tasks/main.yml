---
- name: Assert authentik secrets are vaulted
  ansible.builtin.assert:
    that:
      - authentik_secret_key is defined
      - authentik_secret_key | length >= 50
      - authentik_postgres_password is defined
      - authentik_postgres_password | length > 0
    fail_msg: >-
      Missing authentik secrets in inventories/host_vars/mserver/vault.yml.
      Generate each with 'openssl rand -base64 60 | tr -d "\n"':
      vault_authentik_secret_key (signs sessions and tokens — rotating it logs
      everyone out and invalidates issued tokens) and
      vault_authentik_postgres_password.
  tags: [identity]

# PG_VERSION is written by initdb, so its absence means authentik will start
# against an empty database: a fresh install, or a rebuild before the pg_dump
# restore.
- name: Check whether authentik's database is initialised
  ansible.builtin.stat:
    path: "{{ database_dir }}/authentik/PG_VERSION"
  register: authentik_pg_version
  tags: [identity]

- name: Decide whether to pass bootstrap credentials
  ansible.builtin.set_fact:
    authentik_bootstrap_active: >-
      {{ (not authentik_pg_version.stat.exists)
         if (authentik_bootstrap | string) == 'auto'
         else (authentik_bootstrap | bool) }}
  tags: [identity]

- name: Assert bootstrap secrets are vaulted when bootstrapping
  ansible.builtin.assert:
    that:
      - authentik_bootstrap_password | default('') | length > 0
      - authentik_bootstrap_token | default('') | length > 0
    fail_msg: >-
      authentik is about to bootstrap but vault_authentik_bootstrap_password or
      vault_authentik_bootstrap_token is missing. Without them a fresh database
      serves the public initial-setup flow, which lets whoever reaches it
      first set the admin password.
  when: authentik_bootstrap_active | bool
  tags: [identity]

# Derived from the app list rather than named one by one, because the hand-written
# version drifted: it still checked the first four apps long after three more had
# been added, and a missing secret then surfaced as a censored failure on the
# no_log .env task below instead of as a message naming the variable.
#
# errors='ignore' with the default is what catches the common case. Each secret is
# defined in mserver.yml as a reference to its vault_ key, so when the vault half
# is the missing one the variable itself still exists and only resolving it
# raises — which a bare 'is defined' check reads as present.
- name: Assert every OIDC app in the blueprint has a client secret
  ansible.builtin.assert:
    that:
      - lookup('vars', item.secret_env | lower, default='', errors='ignore') | default('', true) | length > 0
    fail_msg: >-
      {{ item.secret_env | lower }} is missing or empty, so the identity stack's
      .env cannot be written and authentik's blueprint would reject
      {{ item.name }} with "client_secret: This field may not be null". Add
      vault_{{ item.secret_env | lower }} to
      inventories/host_vars/mserver/vault.yml with
      'ansible-vault edit' — generate it with 'openssl rand -hex 32' — and put
      the same value in {{ item.name }}'s own OIDC config.
  loop: "{{ authentik_oidc_apps }}"
  loop_control:
    label: "{{ item.secret_env | lower }}"
  tags: [identity]

- name: Create authentik directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ admin_user }}"
    group: docker
    mode: "0770"
  loop:
    - "{{ config_path }}/authentik/media"
    - "{{ config_path }}/authentik/templates"
    - "{{ config_path }}/authentik/blueprints"
  tags: [identity]

# Created so a typo surfaces here rather than as a silently empty database.
#
# Ownership and mode are deliberately NOT managed: initdb chowns this directory
# to the postgres user (uid 70 in the alpine image) and chmods it 0700, and
# postgres refuses to start if that is changed. Setting owner/group/mode here
# would reset it on every playbook run and break an already-initialised
# database with "could not open file global/pg_filenode.map: Permission denied".
- name: Create authentik data directory
  ansible.builtin.file:
    path: "{{ database_dir }}/authentik"
    state: directory
  tags: [identity]

- name: Create .env file for identity stack
  ansible.builtin.copy:
    dest: "{{ compose_root }}/identity/.env"
    owner: root
    group: docker
    mode: "0640"
    content: |
      CONFIG_PATH={{ config_path }}
      DATABASE_DIR={{ database_dir }}
      PUBLIC_DOMAIN={{ public_domain }}
      INTERNAL_DOMAIN={{ internal_domain }}
      AUTHENTIK_SECRET_KEY={{ authentik_secret_key }}
      AUTHENTIK_POSTGRES_PASSWORD={{ authentik_postgres_password }}
      OIDC_VIKUNJA_SECRET={{ oidc_vikunja_secret }}
      OIDC_TANDOOR_SECRET={{ oidc_tandoor_secret }}
      OIDC_IMMICH_SECRET={{ oidc_immich_secret }}
      OIDC_PAPERLESS_SECRET={{ oidc_paperless_secret }}
      OIDC_AUDIOBOOKSHELF_SECRET={{ oidc_audiobookshelf_secret }}
      OIDC_KAVITA_SECRET={{ oidc_kavita_secret }}
      OIDC_SHELFARR_SECRET={{ oidc_shelfarr_secret }}
      OIDC_CWA_SECRET={{ oidc_cwa_secret }}
  no_log: true
  tags: [identity]

# Always written: identity.yml lists it under env_file, and compose fails on a
# missing env_file. Empty unless bootstrapping, so the next run after the
# database exists removes the credentials from the container.
- name: Create bootstrap env file for authentik
  ansible.builtin.copy:
    dest: "{{ compose_root }}/identity/bootstrap.env"
    owner: root
    group: docker
    mode: "0640"
    content: |
      # Managed by Ansible (roles/identity) — edits on the host are overwritten.
      {% if authentik_bootstrap_active | bool %}
      AUTHENTIK_BOOTSTRAP_PASSWORD={{ authentik_bootstrap_password }}
      AUTHENTIK_BOOTSTRAP_TOKEN={{ authentik_bootstrap_token }}
      AUTHENTIK_BOOTSTRAP_EMAIL={{ acme_email }}
      {% else %}
      # Empty: the database is initialised (see authentik_bootstrap).
      {% endif %}
  no_log: true
  tags: [identity]

# Declarative authentik configuration. authentik watches this directory and
# applies changes on file write, so templating the file IS the deployment —
# there is no API call and no token involved. Secrets are injected with the
# blueprint !Env tag reading container environment, so nothing sensitive is
# committed.
- name: Render authentik blueprints
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ config_path }}/authentik/blueprints/{{ item }}"
    owner: "{{ admin_user }}"
    group: docker
    mode: "0640"
  loop:
    - 00-groups.yaml
    - 10-proxy-providers.yaml
    - 20-oidc-providers.yaml
    - 30-mfa.yaml
  tags: [identity]

- name: Run identity compose file
  community.docker.docker_compose_v2:
    project_src: "{{ compose_root }}/identity"
    files: identity.yml
  tags: [identity]

# The database is the only irreplaceable part of this stack: it holds users,
# groups, providers and application configuration, none of which is in git.
- name: Verify postgres bind mount resolved (not an anonymous volume)
  ansible.builtin.command: >-
    docker inspect authentik_postgres
    --format '{% raw %}{{ range .Mounts }}{{ .Type }}:{{ .Source }} {{ end }}{% endraw %}'
  register: authentik_pg_mounts
  changed_when: false
  failed_when: database_dir ~ '/authentik' not in authentik_pg_mounts.stdout
  tags: [identity]
