---
authentik_proxy_apps:
  - slug: homepage
    name: Homepage
    host: "{{ tunnel_hosts.homepage }}"
    description: Service dashboard
    groups:
      - family
      - authentik Admins
  - slug: hevy
    name: Hevy Insights
    host: "{{ tunnel_hosts.hevy }}"
    description: Workout statistics
    groups:
      - authentik Admins

# Apps integrated via OIDC rather than forward-auth. Use this for anything with
# its own login and/or native (non-browser) clients — a mobile app cannot
# complete a forward-auth redirect, but it can complete an OAuth flow.
#
# redirect_uri must match what the app actually calls back to, exactly:
#   Vikunja  <publicurl>/auth/openid/<provider key from its config file>
#   Tandoor  <publicurl>/accounts/oidc/<provider_id>/login/callback/
authentik_oidc_apps:
  - slug: vikunja
    name: Vikunja
    host: "{{ tunnel_hosts.vikunja }}"
    description: Tasks
    secret_env: OIDC_VIKUNJA_SECRET
    redirect_uris:
      - "https://{{ tunnel_hosts.vikunja }}/auth/openid/authentik"
    groups:
      - family
      - authentik Admins
  - slug: tandoor
    name: Tandoor
    host: "{{ tunnel_hosts.tandoor }}"
    description: Recipes
    secret_env: OIDC_TANDOOR_SECRET
    redirect_uris:
      - "https://{{ tunnel_hosts.tandoor }}/accounts/oidc/authentik/login/callback/"
    groups:
      - family
      - authentik Admins
  - slug: paperless
    name: Paperless
    host: "{{ tunnel_hosts.paperless }}"
    description: Documents
    secret_env: OIDC_PAPERLESS_SECRET
    redirect_uris:
      - "https://{{ tunnel_hosts.paperless }}/accounts/oidc/authentik/login/callback/"
    groups:
      - family
      - authentik Admins
  # Immich supports OIDC natively, INCLUDING the mobile app via a custom URL
  # scheme — so it does not need (and cannot use) forward-auth. Three redirect
  # URIs are required: two for the web client and one for the phone.
  - slug: immich
    name: Immich
    host: "{{ tunnel_hosts.immich }}"
    description: Photos
    secret_env: OIDC_IMMICH_SECRET
    redirect_uris:
      - "https://{{ tunnel_hosts.immich }}/auth/login"
      - "https://{{ tunnel_hosts.immich }}/user-settings"
      # The mobile app's custom scheme. Without this, phone login fails while
      # the browser works.
      - "app.immich:///oauth-callback"
    groups:
      - family
      - authentik Admins
  # Same situation as immich: the iOS app completes the OAuth flow through a
  # custom scheme, so the mobile redirect has to be registered alongside the web
  # one or phone login fails while the browser works.
  - slug: audiobookshelf
    name: Audiobookshelf
    host: "{{ tunnel_hosts.audiobookshelf }}"
    description: Audiobooks
    secret_env: OIDC_AUDIOBOOKSHELF_SECRET
    # Audiobookshelf only matches an OIDC login to an existing account when the
    # email claim asserts verified, and authentik's stock mapping emits false.
    # Without this it reports "User not found and auto-register is disabled"
    # however well the addresses line up.
    email_verified: true
    redirect_uris:
      # The /audiobookshelf prefix is the server's router base path, which it
      # reports as routerBasePath in the client config it serves. Audiobookshelf
      # builds its callback as <origin><base path>/auth/openid/callback, so the
      # prefix belongs here too — without it authentik rejects the authorization
      # request outright, since matching_mode is strict.
      - "https://{{ tunnel_hosts.audiobookshelf }}/audiobookshelf/auth/openid/callback"
      - "https://{{ tunnel_hosts.audiobookshelf }}/audiobookshelf/auth/openid/mobile-redirect"
      - "audiobookshelf://oauth"
    groups:
      - family
      - authentik Admins
  # Kavita reads roles from the claim configured in its OIDC settings, which must
  # be set to 'groups'. A user whose groups do not include kavita's Login role
  # cannot sign in, so these group names have to line up on the kavita side too.
  - slug: kavita
    name: Kavita
    host: "{{ tunnel_hosts.kavita }}"
    description: Ebooks
    secret_env: OIDC_KAVITA_SECRET
    redirect_uris:
      - "https://{{ tunnel_hosts.kavita }}/signin-oidc"
    groups:
      - family
      - authentik Admins
  - slug: shelfarr
    name: Shelfarr
    host: "{{ tunnel_hosts.shelfarr }}"
    description: Book requests
    secret_env: OIDC_SHELFARR_SECRET
    # Shelfarr builds this at runtime from the request host, so it must match the
    # public hostname exactly. OmniAuth path_prefix is /auth, not devise's
    # /users/auth.
    #
    # The http:// variant is registered on purpose. Shelfarr's production.rb ships
    # with assume_ssl and force_ssl commented out and no env var bound to either,
    # and its omniauth initializer reads rack.url_scheme directly — bypassing
    # X-Forwarded-Proto — so behind traefik it sends http:// and authentik
    # rejects the mismatch.
    #
    # Safe here only because secure-headers sets HSTS on every public host with
    # includeSubdomains and a two-year max-age: a browser that has seen any
    # *.moritzpalm.com response upgrades the URL before it leaves the machine, so
    # the authorization code is never actually sent in the clear. Drop this line
    # if shelfarr ever gains a supported proxy setting.
    redirect_uris:
      - "https://{{ tunnel_hosts.shelfarr }}/auth/oidc/callback"
      - "http://{{ tunnel_hosts.shelfarr }}/auth/oidc/callback"
    groups:
      - family
      - authentik Admins
